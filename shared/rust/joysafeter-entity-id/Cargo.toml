[package]
name = "joysafeter-entity-id"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
sqlx = ["dep:sqlx"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["postgres", "uuid", "macros"] }

[dev-dependencies]
serde_json = "1"
