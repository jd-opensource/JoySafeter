syntax = "proto3";
package joysafeter;

service AgentBridge {
  rpc Session(stream RunnerMessage) returns (stream OrchestratorMessage);
}

// ============ runner → orchestrator (upstream) ============

message RunnerMessage {
  reserved 9;
  reserved "skill_load_report";
  oneof payload {
    RunnerReady ready = 1;
    RunnerHarnessEvent event = 2;
    RunnerHarnessResult result = 3;
    RunnerHeartbeat heartbeat = 4;
    RunnerIdle idle = 5;
    MemoryFileSync memory_sync = 6;
    SandboxFileResponse sandbox_file_response = 7;
    SandboxSetupResult setup_result = 8;
  }
}

message RunnerReady {
  string runner_version = 1;
  repeated string available_providers = 2;
  string sandbox_id = 3;
  bool is_reconnect = 4;
  optional string active_task_id = 5;
  repeated string capabilities = 6;
  optional string runner_token = 7;
  optional int64 applied_runtime_config_generation = 8;
}

enum SandboxSetupStatus {
  SANDBOX_SETUP_STATUS_UNSPECIFIED = 0;
  SANDBOX_SETUP_STATUS_APPLIED = 1;
  SANDBOX_SETUP_STATUS_FAILED = 2;
}

message SandboxSetupResult {
  string setup_id = 1;
  int64 runtime_config_generation = 2;
  SandboxSetupStatus status = 3;
  optional string error = 4;
  optional string error_code = 5;
  repeated LoadedSkill loaded_skills = 6;
}

message LoadedSkill {
  string skill_id = 1;
  string skill_version = 2;
  string skill_version_id = 3;
  string skill_name = 4;
  optional string skill_source_type = 5;
  string target = 6;
  optional string security_scan_id = 7;
  optional string target_hash = 8;
  string artifact_hash = 9;
}

message RunnerIdle {
  string sandbox_id = 1;
  optional string work_dir = 2;
  optional string harness_session_id = 3;
}

message RunnerHarnessEvent {
  uint64 seq = 1;
  int64 timestamp_ms = 2;
  oneof event {
    TextEvent text = 3;
    ThinkingEvent thinking = 4;
    ToolUseEvent tool_use = 5;
    ToolResultEvent tool_result = 6;
    ErrorEvent error = 7;
    StatusEvent status = 8;
    LogEvent log = 9;
    ModelRequestStartEvent model_request_start = 10;
    ModelRequestEndEvent model_request_end = 11;
    TaskNotificationEvent task_notification = 12;
  }
}

message TextEvent { string content = 1; }
message ThinkingEvent { string content = 1; }
message ToolUseEvent { string tool = 1; string call_id = 2; string input_json = 3; bool is_control_request = 4; }
message ToolResultEvent { string tool = 1; string call_id = 2; string output = 3; }
message ErrorEvent { string message = 1; }
message StatusEvent { string state = 1; }
message LogEvent { string level = 1; string message = 2; }
message ModelRequestStartEvent { string model = 1; }
message ModelRequestEndEvent { string model = 1; uint64 input_tokens = 2; uint64 output_tokens = 3; uint64 cache_read_tokens = 4; uint64 cache_write_tokens = 5; }

// Background sub-agent (Task tool with run_in_background=true) lifecycle.
// Sourced from claude-code's stream-json `type=system,subtype=task_started|task_progress|task_notification`.
message TaskNotificationEvent {
  // "started" | "progress" | "completed" | "failed" | "stopped"
  string phase = 1;
  string subagent_task_id = 2;
  optional string tool_use_id = 3;
  optional string description = 4;
  // Terminal status — only set for completed/failed/stopped events
  optional string status = 5;
  optional string summary = 6;
  // Final agent text output, parsed from <result> XML block in task_notification
  optional string result = 7;
  optional string output_file = 8;
  // Most recent tool the sub-agent invoked (progress events only)
  optional string last_tool_name = 9;
  optional uint64 total_tokens = 10;
  optional uint64 tool_uses = 11;
  optional uint64 duration_ms = 12;
}

message RunnerHarnessResult {
  string status = 1;
  string output = 2;
  optional string error = 3;
  optional string harness_session_id = 4;
  TokenUsage usage = 5;
  int64 duration_ms = 6;
  optional string work_dir = 7;
}

message TokenUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cache_read_tokens = 3;
  uint64 cache_write_tokens = 4;
  repeated ModelUsageEntry by_model = 5;
}

message ModelUsageEntry {
  string model = 1;
  uint64 input_tokens = 2;
  uint64 output_tokens = 3;
  uint64 cache_read_tokens = 4;
  uint64 cache_write_tokens = 5;
}

message RunnerHeartbeat {
  int64 timestamp_ms = 1;
  // Runtime activity observed by the runner. The orchestrator uses this as a
  // runner-side liveness signal for idle reaping: busy heartbeats disarm idle
  // expiry even when no harness events are flowing yet.
  string runtime_state = 2; // "busy" | "idle"
  optional string active_task_id = 3;
  optional string harness_session_id = 4;
}

// ============ orchestrator → runner (downstream) ============

message OrchestratorMessage {
  oneof payload {
    StartTask start = 1;
    CancelTask cancel = 2;
    SendInput input = 3;
    Shutdown shutdown = 4;
    SetupSandbox setup = 5;
    MemoryFileUpdate memory_update = 6;
    SandboxFileRequest sandbox_file_request = 7;
  }
}

message SandboxFileRequest {
  string request_id = 1;
  string operation = 2; // "list" | "content" | "raw" | "archive"
  string path = 3;
  uint64 max_bytes = 4;
}

message SandboxFileEntry {
  string name = 1;
  string path = 2;
  string file_type = 3; // "file" | "directory"
  uint64 size = 4;
  int64 mtime = 5;
}

message SandboxFileResponse {
  string request_id = 1;
  bool ok = 2;
  string code = 3;
  string error = 4;
  string path = 5;
  repeated SandboxFileEntry entries = 6;
  string encoding = 7; // "utf-8" | "base64"
  string content = 8;
  bytes content_bytes = 9;
  string filename = 10;
  string content_type = 11;
  uint64 size = 12;
}

enum ToolDecision {
  TOOL_DECISION_UNSPECIFIED = 0;
  TOOL_DECISION_ALLOW = 1;
  TOOL_DECISION_ASK = 2;
  TOOL_DECISION_DENY = 3;
}

message McpToolSelector {
  string server_name = 1;
  optional string tool_name = 2;
}

message ToolRule {
  ToolDecision decision = 1;
  oneof selector {
    string builtin_name = 2;
    McpToolSelector mcp = 3;
  }
}

message ToolPolicy {
  ToolDecision default_decision = 1;
  repeated ToolRule rules = 2;
}

message MemoryFileUpdate {
  string store_mount_name = 1;
  string relative_path = 2;
  bytes content = 3;
  string operation = 4;
}

message SetupSandbox {
  reserved 7 to 8;
  reserved 13 to 17;
  reserved "secrets", "files", "file_refs", "permission_mode", "allowed_tools", "disallowed_tools", "ask_tools";
  repeated SkillArchive skills = 1;
  repeated McpConfig mcp_servers = 2;
  repeated CustomTool custom_tools = 3;
  repeated string setup_commands = 4;
  optional string work_dir = 5;
  map<string, string> env = 6;
  string provider = 9;
  optional string model = 10;
  optional string memory_system_prompt = 11;
  repeated MemoryStoreMount memory_mounts = 12;
  repeated RepoConfig repos = 18;
  ToolPolicy tool_policy = 19;
  string setup_id = 20;
  int64 runtime_config_generation = 21;
}

message MemoryStoreMount {
  reserved 1;
  reserved "store_id";
  string mount_name = 2;
  string mount_path = 3;
  string access = 4;
  repeated MemoryFile files = 5;
}

message MemoryFile {
  string relative_path = 1;
  bytes content = 2;
}

message MemoryFileSync {
  string store_mount_name = 1;
  string relative_path = 2;
  string content = 3;
  string operation = 4;
}

message StartTask {
  reserved 10, 14 to 17, 20;
  reserved "secrets", "skills", "allowed_tools", "disallowed_tools", "permission_mode", "ask_tools";
  string task_id = 1;
  string provider = 2;
  string prompt = 3;
  optional string system_prompt = 4;
  optional string harness_session_id = 5;
  optional string model = 6;
  optional uint32 max_turns = 7;
  uint64 timeout_seconds = 8;
  map<string, string> env = 9;
  repeated McpConfig mcp_servers = 11;
  repeated RepoConfig repos = 12;
  optional string work_dir = 13;
  repeated string setup_commands = 18;
  repeated CustomTool custom_tools = 19;
  // "append" (default): --append-system-prompt (CC keeps its built-in prompt)
  // "replace": --system-prompt (CC built-in prompt is replaced)
  optional string system_prompt_mode = 21;
  repeated FileMount files = 22;
  repeated FileRef file_refs = 23;
  ToolPolicy tool_policy = 24;
  int64 runtime_config_generation = 25;
}

message CustomTool {
  string name = 1;
  string description = 2;
  string input_schema_json = 3;
}

message SkillArchive {
  string name = 1;
  bytes tar_gz = 2;
  string target = 3;
  optional string skill_id = 4;
  optional string skill_version = 5;
  optional string skill_version_id = 6;
  optional string skill_name = 7;
  optional string skill_source_type = 8;
  optional string security_scan_id = 9;
  optional string target_hash = 10;
  optional string artifact_hash = 11;
}

message FileMount {
  string path = 1;
  bytes content = 2;
  string filename = 3;
}

message FileRef {
  string path = 1;
  string url = 2;
  string filename = 3;
  int64 size_bytes = 4;
}

enum McpTransport {
  MCP_TRANSPORT_UNSPECIFIED = 0;
  MCP_TRANSPORT_STREAMABLE_HTTP = 1;
  MCP_TRANSPORT_SSE = 2;
  MCP_TRANSPORT_LOCAL_STDIO = 3;
}

message McpConfig {
  reserved 5;
  reserved "server_type";
  string name = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string url = 6;
  map<string, string> headers = 7;
  McpTransport transport = 8;
}

message RepoConfig {
  string url = 1;
  string branch = 2;
  string path = 3;
  // Clone-only credential. Never logged or echoed in API responses.
  string authorization_token = 4;
  string mount_name = 5;
}

message CancelTask {
  string reason = 1;
}

message SendInput {
  string content = 1;
}

message Shutdown {
  string reason = 1;
}
