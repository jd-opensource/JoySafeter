[package]
name = "joysafeter-agent-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "JoySafeter Agent Gateway control plane"

[[bin]]
name = "joysafeter-agent-gateway"
path = "src/main.rs"

[dependencies]
joysafeter-entity-id = { path = "../../../shared/rust/joysafeter-entity-id" }
joysafeter-agent-gateway-contract = { path = "../../../shared/rust/joysafeter-agent-gateway-contract" }

anyhow = "1"
async-trait = "0.1"
axum = "0.7"
chrono = "0.4"
base64 = "0.22"
envoy-types = "=0.5.1"
futures = "0.3"
hex = "0.4"
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube = { version = "0.98", features = ["client", "rustls-tls"] }
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = "0.12"
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
