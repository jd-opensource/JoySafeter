[package]
name = "joysafeter-orchestrator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "JoySafeter Orchestrator — Rust implementation"

[[bin]]
name = "joysafeter-orchestrator"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# gRPC
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
prost14 = { package = "prost", version = "0.14" }
x509-parser = "0.18.1"
# Pin the process-default rustls CryptoProvider (aws-lc-rs). tonic's mTLS server
# uses rustls 0.23, which panics at runtime when both ring and aws-lc-rs are in
# the tree unless a default provider is installed; main() installs aws_lc_rs.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
# Pre-generated Envoy xDS protobuf types (Listener, ADS server, filter configs).
# Pinned to =0.5.1: it targets tonic ">=0.12.3, <0.13" / prost 0.13, matching this
# crate's tonic 0.12. 0.6.0+ require tonic 0.13, which would fork the tonic graph.
# Only used by the gRPC (Delta xDS) LDS backend; filesystem backend does not touch it.
envoy-types = "=0.5.1"
# Compiler-only protobuf baseline. Runtime ADS/ext_authz remains on 0.5.1 / tonic
# 0.12 until the runner gRPC server is migrated; compiled resources cross that
# boundary as protobuf Any bytes, which are wire compatible.
envoy-types-v076 = { package = "envoy-types", version = "=0.7.6" }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

# Docker
bollard = "0.18"

# Kubernetes native client (runtime K8s sandbox and NetworkPolicy operations).
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "ws"] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }

# HTTP client (for Daytona/E2B providers)
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"], optional = true }
aws-credential-types = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Config
dotenvy = "0.15"

# Crypto
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
aes-gcm = "0.10"

# Async trait
async-trait = "0.1"

# Concurrent collections
dashmap = "6"

# System
gethostname = "0.5"

# Archive (for image builder)
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

# Regex (for package name validation)
regex-lite = "0.1"

# Random (for runner token generation)
rand = "0.8"
hex = "0.4"
url = "2"
idna = "1"

[build-dependencies]
tonic-build = "0.12"

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
[features]
default = ["s3"]
# S3/OSS object-storage backend (sandbox/storage.rs). Pulls the AWS SDK, which is
# one of the heaviest compile-time dependencies in the tree. ON by default so
# production/CI builds (plain `cargo build --release`) are unchanged. For faster
# local iteration, build with `--no-default-features` to skip the AWS SDK entirely;
# STORAGE_BACKEND=s3|oss then fails fast at startup with a clear message.
s3 = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sdk-s3"]

# ---------------------------------------------------------------------------
# Build profile optimization — reduce target/ size from ~10GB to ~3-4GB
# ---------------------------------------------------------------------------

[profile.dev]
debug = 0                       # No debug info (saves ~60% disk, gdb/lldb won't work but backtraces still work)
split-debuginfo = "unpacked"    # macOS: avoid huge .dSYM bundles
incremental = true              # Keep incremental compilation (fast rebuilds)

[profile.dev.package."*"]
opt-level = 1                   # Compile dependencies at O1 (smaller + faster runtime, slightly slower build)

[profile.release]
opt-level = "s"                 # optimize for size (keeps better perf than "z" for a long-running service)
lto = "fat"                     # full link-time optimization (smaller than thin)
codegen-units = 1               # better cross-module optimization (slower build, smaller binary)
strip = true                    # Strip symbols from release binary
# NOTE: panic stays "unwind" (default) on purpose — orchestrator is a long-running
# axum/tonic service; unwinding isolates a panicking request instead of aborting
# the whole process.

# Fast local release build: same size optimization but skips the slow fat-LTO /
# single-codegen-unit passes. Larger binary, much faster link — use for local
# iteration via `cargo build --profile release-fast`. Production keeps [profile.release].
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
