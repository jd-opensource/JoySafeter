# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python - Ruff (fast linter and formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Backend - Ruff strict check
  - repo: local
    hooks:
      - id: backend-ruff-check
        name: Backend Ruff Check (strict)
        entry: bash -c 'cd backend && .venv/bin/ruff check . || exit 1'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
        always_run: false
        stages: [pre-commit]

  # Frontend - ESLint + TypeScript type-check + Prettier format check
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend ESLint
        entry: bash -c 'cd frontend && bun run lint || exit 1'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
        always_run: false
        stages: [pre-commit]

      - id: frontend-type-check
        name: Frontend TypeScript Check
        entry: bash -c 'cd frontend && bun run type-check || exit 1'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        always_run: false
        stages: [pre-commit]

      - id: frontend-format-check
        name: Frontend Prettier Check
        entry: bash -c 'cd frontend && bun run format:check || exit 1'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|md)$
        pass_filenames: false
        always_run: false
        stages: [pre-commit]

# CI configuration
ci:
  autofix_commit_msg: 'style: auto-fix by pre-commit hooks'
  autoupdate_commit_msg: 'chore: update pre-commit hooks'
