apiVersion: v1
kind: ServiceAccount
metadata:
  name: joysafeter-orchestrator
  namespace: joysafeter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: joysafeter-orchestrator
  namespace: joysafeter
rules:
# Sandbox pod lifecycle
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/log", "pods/attach"]
  verbs: ["get", "list", "watch", "create", "delete"]
# PVC for workspace volumes
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "create", "delete"]
# Leader Election (Lease)
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: joysafeter-orchestrator
  namespace: joysafeter
subjects:
- kind: ServiceAccount
  name: joysafeter-orchestrator
  namespace: joysafeter
roleRef:
  kind: Role
  name: joysafeter-orchestrator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: joysafeter-orchestrator
  namespace: joysafeter
spec:
  selector:
    app: joysafeter-orchestrator
  ports:
  - port: 9090
    targetPort: grpc
    name: grpc
  - port: 9091
    targetPort: health
    name: health
