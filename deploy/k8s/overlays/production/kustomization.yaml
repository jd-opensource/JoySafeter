apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - orchestrator-pdb.yaml
patches:
  - target:
      kind: ConfigMap
      name: joysafeter-config
      namespace: joysafeter-control
    patch: |-
      - op: replace
        path: /data/JOYSAFETER_EGRESS_POLICY_AUTHORITY_ENABLED
        value: "true"
      - op: replace
        path: /data/JOYSAFETER_K8S_EGRESS_MANAGEMENT_ENABLED
        value: "true"
      - op: remove
        path: /data/JOYSAFETER_EGRESS_GATEWAY_HOST
      - op: remove
        path: /data/JOYSAFETER_EGRESS_GATEWAY_PORT
      - op: remove
        path: /data/JOYSAFETER_EGRESS_GATEWAY_REQUIRE_SANDBOX_TOKEN
      - op: remove
        path: /data/JOYSAFETER_EGRESS_GATEWAY_URL
  - target:
      kind: Deployment
      name: joysafeter-orchestrator
      namespace: joysafeter-control
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: joysafeter-orchestrator
        namespace: joysafeter-control
      spec:
        replicas: 3
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 1
        template:
          spec:
            enableServiceLinks: false
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: joysafeter-orchestrator
            containers:
              - name: orchestrator
                readinessProbe:
                  exec:
                    command:
                      - bash
                      - -ec
                      - exec 3<>/dev/tcp/127.0.0.1/9090; exec 4<>/dev/tcp/127.0.0.1/18090
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    cpu: "2"
                    memory: 4Gi
  - target:
      kind: Service
      name: joysafeter-egress-gateway
      namespace: joysafeter-control
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: joysafeter-egress-gateway
        namespace: joysafeter-control
      $patch: delete
  - target:
      kind: Deployment
      name: joysafeter-egress-gateway
      namespace: joysafeter-control
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: joysafeter-egress-gateway
        namespace: joysafeter-control
      $patch: delete
  - target:
      kind: Secret
      name: joysafeter-secret
      namespace: joysafeter-control
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: joysafeter-secret
        namespace: joysafeter-control
      $patch: delete
  - target:
      kind: Service
      name: postgres
      namespace: joysafeter-control
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
        namespace: joysafeter-control
      $patch: delete
  - target:
      kind: Deployment
      name: postgres
      namespace: joysafeter-control
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgres
        namespace: joysafeter-control
      $patch: delete
  - target:
      kind: Service
      name: redis
      namespace: joysafeter-control
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: redis
        namespace: joysafeter-control
      $patch: delete
  - target:
      kind: Deployment
      name: redis
      namespace: joysafeter-control
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis
        namespace: joysafeter-control
      $patch: delete
