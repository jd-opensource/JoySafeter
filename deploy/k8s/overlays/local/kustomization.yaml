apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: joysafeter-egress-controller
      namespace: joysafeter-control
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: joysafeter-egress-controller
        namespace: joysafeter-control
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: JOYSAFETER_EGRESS_XDS_MTLS
                    value: "false"
                  - name: JOYSAFETER_EGRESS_AUTHZ_MTLS
                    value: "false"
                  - name: JOYSAFETER_EGRESS_DOWNSTREAM_TLS
                    value: "false"
            volumes:
              - name: xds-tls
                secret:
                  secretName: joysafeter-egress-controller-tls
                  optional: true
  - target:
      kind: Deployment
      name: joysafeter-orchestrator
      namespace: joysafeter-control
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: joysafeter-orchestrator
        namespace: joysafeter-control
      spec:
        template:
          spec:
            volumes:
              - name: authz-server-tls
                secret:
                  secretName: joysafeter-egress-authz-server-tls
                  optional: true
  - target:
      kind: PodDisruptionBudget
      name: joysafeter-egress-controller
      namespace: joysafeter-control
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target:
      kind: Deployment
      name: joysafeter-egress-envoy
      namespace: joysafeter-egress
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: joysafeter-egress-envoy
        namespace: joysafeter-egress
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: envoy
                args:
                  - --config-path
                  - /etc/joysafeter-egress-envoy/bootstrap-plaintext.yaml
                  - --service-node
                  - $(POD_NAME)
                  - --service-cluster
                  - joysafeter-egress
                  - --log-level
                  - info
                  - --concurrency
                  - "2"
                  - --disable-hot-restart
            volumes:
              - name: xds-client-tls
                secret:
                  secretName: joysafeter-egress-envoy-xds-client-tls
                  optional: true
              - name: authz-client-tls
                secret:
                  secretName: joysafeter-egress-authz-client-tls
                  optional: true
              - name: downstream-server-tls
                secret:
                  secretName: joysafeter-egress-downstream-server-tls
                  optional: true
  - target:
      kind: PodDisruptionBudget
      name: joysafeter-egress-envoy
      namespace: joysafeter-egress
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: joysafeter-egress-envoy
      namespace: joysafeter-egress
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: ConfigMap
      name: joysafeter-config
      namespace: joysafeter-control
    patch: |-
      - op: replace
        path: /data/JOYSAFETER_EGRESS_AUTHZ_MTLS
        value: "false"
      - op: replace
        path: /data/JOYSAFETER_EGRESS_ENVOY_CREDENTIAL_URL
        value: http://joysafeter-egress-envoy.joysafeter-egress.svc.cluster.local:8443
      - op: replace
        path: /data/JOYSAFETER_EGRESS_ENVOY_FORWARD_PROXY_URL
        value: http://joysafeter-egress-envoy.joysafeter-egress.svc.cluster.local:8080
