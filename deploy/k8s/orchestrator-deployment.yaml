# Orchestrator HA Deployment with anti-affinity + leader election
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joysafeter-orchestrator
  namespace: joysafeter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: joysafeter-orchestrator
  # Recreate is NOT used (we want rolling update so one pod is always running).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: joysafeter-orchestrator
    spec:
      serviceAccountName: joysafeter-orchestrator
      terminationGracePeriodSeconds: 30

      # Anti-affinity: spread replicas across different nodes so a single
      # node failure doesn't take out both leader and standby.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: joysafeter-orchestrator
            topologyKey: kubernetes.io/hostname

      containers:
      - name: orchestrator
        image: aisec-repo.jd.com/joysafeter/joysafeter-orchestrator-rs:latest
        ports:
        - containerPort: 9090
          name: grpc
        - containerPort: 9091
          name: health
        env:
        - name: JOYSAFETER_GRPC_HOST
          value: "0.0.0.0"
        - name: JOYSAFETER_GRPC_PORT
          value: "9090"
        - name: JOYSAFETER_GRPC_PUBLIC_URL
          value: "http://joysafeter-orchestrator:9090"
        - name: JOYSAFETER_SANDBOX_PROVIDER
          value: "k8s"
        - name: JOYSAFETER_K8S_NAMESPACE
          value: "joysafeter"
        - name: TZ
          value: "Asia/Shanghai"
        - name: JOYSAFETER_TIMEZONE
          value: "Asia/Shanghai"
        - name: JOYSAFETER_SANDBOX_TIMEZONE
          value: "Asia/Shanghai"
        # Leader Election
        - name: JOYSAFETER_LEADER_ELECTION_ENABLED
          value: "true"
        - name: JOYSAFETER_LEADER_LEASE_NAME
          value: "joysafeter-orchestrator-leader"
        - name: JOYSAFETER_LEADER_LEASE_DURATION_SEC
          value: "10"
        - name: JOYSAFETER_LEADER_RENEW_INTERVAL_SEC
          value: "3"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Envoy
        - name: JOYSAFETER_ENVOY_ENABLED
          value: "true"
        - name: JOYSAFETER_ENVOY_XDS_MODE
          value: "grpc"
        - name: JOYSAFETER_ENVOY_SOCKET_HOST_DIR
          value: "/data/joysafeter/envoy-sockets"
        # Cloud services (from Secret)
        envFrom:
        - secretRef:
            name: joysafeter-secrets

        # Readiness: only leader receives traffic via Service
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 9091
          periodSeconds: 2
          failureThreshold: 3
          successThreshold: 1

        # Liveness: restart if process is unresponsive
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: 9091
          periodSeconds: 10
          failureThreshold: 3
          initialDelaySeconds: 5

        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "4"
            memory: "4Gi"

        volumeMounts:
        - name: envoy-sockets
          mountPath: /data/joysafeter/envoy-sockets

      volumes:
      - name: envoy-sockets
        hostPath:
          path: /data/joysafeter/envoy-sockets
          type: DirectoryOrCreate
