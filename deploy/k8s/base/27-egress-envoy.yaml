apiVersion: v1
kind: ServiceAccount
metadata:
  name: joysafeter-egress-envoy
  namespace: joysafeter-egress
  labels:
    app.kubernetes.io/name: joysafeter-egress-envoy
    app.kubernetes.io/part-of: joysafeter
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: joysafeter-egress-envoy-bootstrap
  namespace: joysafeter-egress
  labels:
    app.kubernetes.io/name: joysafeter-egress-envoy
    app.kubernetes.io/part-of: joysafeter
data:
  bootstrap.yaml: |
    node:
      id: __POD_NAME__
      cluster: joysafeter-egress
      metadata:
        deployment_id: joysafeter
        environment: production
        region: local
        provider: k8s
        shard_id: "0"
        host_id: __NODE_NAME__
        envoy_version: 1.39.0
        config_schema_version: "1"
    dynamic_resources:
      lds_config:
        ads: {}
        resource_api_version: V3
      cds_config:
        ads: {}
        resource_api_version: V3
      ads_config:
        api_type: DELTA_GRPC
        transport_api_version: V3
        grpc_services:
          - envoy_grpc:
              cluster_name: xds_cluster
    static_resources:
      listeners:
        - name: restricted_observability
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 9902
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: restricted_observability
                    route_config:
                      name: restricted_observability
                      virtual_hosts:
                        - name: local_admin
                          domains: ["*"]
                          routes:
                            - match:
                                path: /healthz
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "ok\n"
                            - match:
                                path: /ready
                              route:
                                cluster: envoy_admin
                            - match:
                                path: /stats/prometheus
                              route:
                                cluster: envoy_admin
                            - match:
                                prefix: /
                              direct_response:
                                status: 404
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: xds_cluster
          type: STRICT_DNS
          connect_timeout: 5s
          dns_lookup_family: V4_PREFERRED
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: xds_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                          address:
                            socket_address:
                              address: __XDS_ADDRESS__
                              port_value: 18000
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: __XDS_SNI__
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_3
                  tls_maximum_protocol_version: TLSv1_3
                tls_certificates:
                  - certificate_chain:
                      filename: /var/run/joysafeter-egress/xds-client-tls/tls.crt
                    private_key:
                      filename: /var/run/joysafeter-egress/xds-client-tls/tls.key
                validation_context:
                  trusted_ca:
                    filename: /var/run/joysafeter-egress/xds-client-tls/ca.crt
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: __XDS_SNI__
        - name: envoy_admin
          type: STATIC
          connect_timeout: 1s
          load_assignment:
            cluster_name: envoy_admin
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 9901
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901
    overload_manager:
      refresh_interval: 0.25s
      resource_monitors:
        - name: envoy.resource_monitors.fixed_heap
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.resource_monitors.fixed_heap.v3.FixedHeapConfig
            max_heap_size_bytes: 805306368
      actions:
        - name: envoy.overload_actions.shrink_heap
          triggers:
            - name: envoy.resource_monitors.fixed_heap
              threshold:
                value: 0.85
        - name: envoy.overload_actions.stop_accepting_requests
          triggers:
            - name: envoy.resource_monitors.fixed_heap
              threshold:
                value: 0.95
  bootstrap-plaintext.yaml: |
    node:
      id: __POD_NAME__
      cluster: joysafeter-egress
      metadata:
        deployment_id: joysafeter
        environment: production
        region: local
        provider: k8s
        shard_id: "0"
        host_id: __NODE_NAME__
        envoy_version: 1.39.0
        config_schema_version: "1"
    dynamic_resources:
      lds_config:
        ads: {}
        resource_api_version: V3
      cds_config:
        ads: {}
        resource_api_version: V3
      ads_config:
        api_type: DELTA_GRPC
        transport_api_version: V3
        grpc_services:
          - envoy_grpc:
              cluster_name: xds_cluster
    static_resources:
      listeners:
        - name: restricted_observability
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 9902
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: restricted_observability
                    route_config:
                      name: restricted_observability
                      virtual_hosts:
                        - name: local_admin
                          domains: ["*"]
                          routes:
                            - match:
                                path: /healthz
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "ok\n"
                            - match:
                                path: /ready
                              route:
                                cluster: envoy_admin
                            - match:
                                path: /stats/prometheus
                              route:
                                cluster: envoy_admin
                            - match:
                                prefix: /
                              direct_response:
                                status: 404
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: xds_cluster
          type: STRICT_DNS
          connect_timeout: 5s
          dns_lookup_family: V4_PREFERRED
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: xds_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: joysafeter-orchestrator.joysafeter-control.svc.cluster.local
                          port_value: 18000
        - name: envoy_admin
          type: STATIC
          connect_timeout: 1s
          load_assignment:
            cluster_name: envoy_admin
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 9901
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901
    overload_manager:
      refresh_interval: 0.25s
      resource_monitors:
        - name: envoy.resource_monitors.fixed_heap
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.resource_monitors.fixed_heap.v3.FixedHeapConfig
            max_heap_size_bytes: 805306368
      actions:
        - name: envoy.overload_actions.shrink_heap
          triggers:
            - name: envoy.resource_monitors.fixed_heap
              threshold:
                value: 0.85
        - name: envoy.overload_actions.stop_accepting_requests
          triggers:
            - name: envoy.resource_monitors.fixed_heap
              threshold:
                value: 0.95
---
apiVersion: v1
kind: Service
metadata:
  name: joysafeter-egress-envoy
  namespace: joysafeter-egress
  labels:
    app.kubernetes.io/name: joysafeter-egress-envoy
    app.kubernetes.io/part-of: joysafeter
spec:
  type: ClusterIP
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: joysafeter-egress-envoy
  ports:
    - name: credential-https
      port: 8443
      targetPort: credential
    - name: forward-https
      port: 8080
      targetPort: forward
---
apiVersion: v1
kind: Service
metadata:
  name: joysafeter-egress-envoy-metrics
  namespace: joysafeter-egress
  labels:
    app.kubernetes.io/name: joysafeter-egress-envoy
    app.kubernetes.io/part-of: joysafeter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: joysafeter-egress-envoy
  ports:
    - name: metrics
      port: 9902
      targetPort: observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: joysafeter-egress-envoy
  namespace: joysafeter-egress
  labels:
    app.kubernetes.io/name: joysafeter-egress-envoy
    app.kubernetes.io/part-of: joysafeter
spec:
  revisionHistoryLimit: 5
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: joysafeter-egress-envoy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joysafeter-egress-envoy
        app.kubernetes.io/part-of: joysafeter
    spec:
      serviceAccountName: joysafeter-egress-envoy
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-bootstrap
          image: envoyproxy/envoy:v1.39.0@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              sed
              -e "s|__POD_NAME__|${POD_NAME}|g"
              -e "s|__NODE_NAME__|${NODE_NAME}|g"
              -e "s|__XDS_ADDRESS__|${XDS_ADDRESS}|g"
              -e "s|__XDS_SNI__|${XDS_SNI}|g"
              /etc/joysafeter-egress-envoy-template/bootstrap.yaml
              > /etc/joysafeter-egress-envoy/bootstrap.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: XDS_ADDRESS
              value: joysafeter-orchestrator.joysafeter-control.svc.cluster.local
            - name: XDS_SNI
              value: joysafeter-orchestrator.joysafeter-control.svc.cluster.local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: bootstrap-template
              mountPath: /etc/joysafeter-egress-envoy-template
              readOnly: true
            - name: bootstrap
              mountPath: /etc/joysafeter-egress-envoy
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.39.0@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/envoy"]
          args:
            - --config-path
            - /etc/joysafeter-egress-envoy/bootstrap.yaml
            - --service-cluster
            - joysafeter-egress
            - --log-level
            - info
            - --concurrency
            - "2"
            - --disable-hot-restart
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: credential
              containerPort: 8443
            - name: forward
              containerPort: 8080
            - name: observability
              containerPort: 9902
          startupProbe:
            httpGet:
              path: /healthz
              port: observability
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: observability
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: observability
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: bootstrap
              mountPath: /etc/joysafeter-egress-envoy
              readOnly: true
            - name: xds-client-tls
              mountPath: /var/run/joysafeter-egress/xds-client-tls
              readOnly: true
            - name: authz-client-tls
              mountPath: /var/run/joysafeter-egress/authz-tls
              readOnly: true
            - name: downstream-server-tls
              mountPath: /var/run/joysafeter-egress/downstream-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap-template
          configMap:
            name: joysafeter-egress-envoy-bootstrap
        - name: bootstrap
          emptyDir:
            sizeLimit: 1Mi
        - name: xds-client-tls
          secret:
            secretName: joysafeter-egress-envoy-xds-client-tls
        - name: authz-client-tls
          secret:
            secretName: joysafeter-egress-authz-client-tls
        - name: downstream-server-tls
          secret:
            secretName: joysafeter-egress-downstream-server-tls
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: joysafeter-egress-envoy
  namespace: joysafeter-egress
  labels:
    app.kubernetes.io/name: joysafeter-egress-envoy
    app.kubernetes.io/part-of: joysafeter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: joysafeter-egress-envoy
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: joysafeter-sandboxes
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9902
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: joysafeter-control
          podSelector:
            matchLabels:
              app.kubernetes.io/name: joysafeter-orchestrator
      ports:
        - protocol: TCP
          port: 18000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: joysafeter-control
          podSelector:
            matchLabels:
              app.kubernetes.io/name: joysafeter-orchestrator
      ports:
        - protocol: TCP
          port: 18090
    - to:
        # L7 is authoritative for egress: the credential listener only forwards to
        # the single configured upstream host of each sandbox's secret, the
        # forward-proxy honors the per-sandbox host allowlist, and ext_authz gates
        # identity. So this L3 rule does NOT try to approximate "public internet
        # only" by excluding all RFC1918 space (which wrongly blocks legitimately
        # allowlisted model gateways that live on internal IPs, e.g. an
        # ai-api.*.internal on 10.0.0.0/8). It blocks ONLY the genuinely dangerous
        # SSRF targets: cloud metadata / link-local, this cluster's own pod and
        # service CIDRs (lateral movement), loopback, and multicast/reserved.
        # NOTE: the pod/service CIDRs below are THIS cluster's (colima k3s:
        # pods 10.42.0.0/16, services 10.43.0.0/16) — set them to the target
        # cluster's CIDRs; k8s NetworkPolicy is IP-based and cannot match DNS.
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 10.42.0.0/16
              - 10.43.0.0/16
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - 2001:db8::/32
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports:
        - protocol: TCP
