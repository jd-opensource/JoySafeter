apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: joysafeter-sandboxes
  labels:
    app.kubernetes.io/part-of: joysafeter
spec:
  hard:
    pods: "100"
    requests.cpu: "20"
    requests.memory: 80Gi
    limits.cpu: "100"
    limits.memory: 200Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-limits
  namespace: joysafeter-sandboxes
  labels:
    app.kubernetes.io/part-of: joysafeter
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 50m
        memory: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: joysafeter-sandboxes
  labels:
    app.kubernetes.io/part-of: joysafeter
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runner-control-plane
  namespace: joysafeter-sandboxes
  labels:
    app.kubernetes.io/part-of: joysafeter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: joysafeter-sandbox
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: joysafeter-control
          podSelector:
            matchLabels:
              app.kubernetes.io/name: joysafeter-orchestrator
      ports:
        - protocol: TCP
          port: 9090
