apiVersion: v1
kind: ServiceAccount
metadata:
  name: joysafeter-orchestrator
  namespace: joysafeter-control
  labels:
    app.kubernetes.io/name: joysafeter-orchestrator
    app.kubernetes.io/part-of: joysafeter
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: joysafeter-sandbox-manager
  namespace: joysafeter-sandboxes
  labels:
    app.kubernetes.io/part-of: joysafeter
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: joysafeter-orchestrator-sandbox-manager
  namespace: joysafeter-sandboxes
  labels:
    app.kubernetes.io/part-of: joysafeter
subjects:
  - kind: ServiceAccount
    name: joysafeter-orchestrator
    namespace: joysafeter-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: joysafeter-sandbox-manager
