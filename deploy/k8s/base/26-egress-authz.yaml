apiVersion: v1
kind: Service
metadata:
  name: joysafeter-egress-authz
  namespace: joysafeter-control
  labels:
    app.kubernetes.io/name: joysafeter-egress-authz
    app.kubernetes.io/part-of: joysafeter
spec:
  selector:
    app.kubernetes.io/name: joysafeter-orchestrator
  ports:
    - name: grpc-authz
      port: 18090
      targetPort: authz
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: joysafeter-orchestrator-ingress
  namespace: joysafeter-control
  labels:
    app.kubernetes.io/name: joysafeter-egress-authz
    app.kubernetes.io/part-of: joysafeter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: joysafeter-orchestrator
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: joysafeter-sandboxes
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: joysafeter-control
      ports:
        - protocol: TCP
          port: 9090
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: joysafeter-egress
      ports:
        - protocol: TCP
          port: 18090
