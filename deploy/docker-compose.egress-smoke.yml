# Docker egress smoke overlay (Plan 2 / C-2).
#
# Layers onto docker-compose.yml to run a tamper-evident, mock-upstream
# end-to-end egress test of the unified controller path on Docker:
#   controller SOURCE=postgres + Docker Envoy in `controller` mode (ADS to the
#   Go controller) + orchestrator ext_authz + a mock upstream echo server.
# Driven by deploy/egress-compose-smoke.sh. Uses a mock upstream so NO real
# API key is needed (mock echoes received headers to prove credential injection
# and that sandbox-supplied auth was stripped).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.egress-smoke.yml up -d --wait
services:
  # Mock upstream: echoes the request (method, path, headers, body) as JSON so
  # the smoke can prove the platform credential header arrived and cross-correlate
  # the Envoy x-request-id. Runs an inline stdlib-Python echo server on the
  # already-built backend image — no third-party echo image (the daocloud mirror
  # 403s mendhak/http-https-echo) and no extra build context. No API key needed.
  # Header values are emitted as single-element lists to match the smoke's
  # x-request-id parser; each request's x-request-id is logged for Source D.
  joysafeter-egress-mock-upstream:
    image: ${BACKEND_FULL_IMAGE:-joysafeter-backend:latest}
    container_name: joysafeter-egress-mock-upstream
    restart: unless-stopped
    environment:
      HTTP_PORT: "8080"
    entrypoint: ["python3", "-c"]
    command:
      - |
        import json, os
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        class Echo(BaseHTTPRequestHandler):
            def _echo(self):
                n = int(self.headers.get("content-length") or 0)
                body = self.rfile.read(n).decode("utf-8", "replace") if n else ""
                headers = {k: [v] for k, v in self.headers.items()}
                rid = self.headers.get("x-request-id", "")
                print("%s %s x-request-id=%s" % (self.command, self.path, rid), flush=True)
                payload = json.dumps({"method": self.command, "path": self.path,
                                      "headers": headers, "body": body}).encode()
                self.send_response(200)
                self.send_header("content-type", "application/json")
                self.send_header("content-length", str(len(payload)))
                self.end_headers()
                self.wfile.write(payload)
            do_GET = _echo
            do_POST = _echo
            def log_message(self, *a):
                pass
        port = int(os.environ.get("HTTP_PORT", "8080"))
        ThreadingHTTPServer(("0.0.0.0", port), Echo).serve_forever()
    expose:
      - "8080"
    networks:
      - joysafeter-network

  # Orchestrator: the two-plane controller-mode egress wiring (XDS controller
  # mode, durable authority, plaintext ext_authz bind on :18090, docker-local
  # host id) now lives in the BASE docker-compose.yml common-env and is the
  # single source of truth. The only smoke-specific override is redirecting the
  # platform LLM allowlist at the mock upstream so extract_llm_egress injects the
  # (dummy) platform credential toward the mock instead of the real model host.
  orchestrator-rs:
    environment:
      JOYSAFETER_LLM_EGRESS_ALLOWED_HOSTS: joysafeter-egress-mock-upstream
