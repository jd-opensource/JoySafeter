# Docker egress smoke overlay (Plan 2 / C-2).
#
# Layers onto docker-compose.yml to run a tamper-evident, mock-upstream
# end-to-end egress test of the unified controller path on Docker:
#   controller SOURCE=postgres + Docker Envoy in `controller` mode (ADS to the
#   Go controller) + orchestrator ext_authz + a mock upstream echo server.
# Driven by deploy/egress-compose-smoke.sh. Uses a mock upstream so NO real
# API key is needed (mock echoes received headers to prove credential injection
# and that sandbox-supplied auth was stripped).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.egress-smoke.yml up -d --wait
services:
  # Mock upstream: echoes the request (method, path, headers, body) as JSON so
  # the smoke can prove the platform credential header arrived and cross-correlate
  # the Envoy x-request-id. Built from deploy/mock-upstream (a ~60-line Go echo
  # server on a pinned Go base) so CI never pulls a third-party echo image — the
  # daocloud mirror 403s docker.m.daocloud.io/mendhak/http-https-echo. No key.
  joysafeter-egress-mock-upstream:
    image: ${MOCK_UPSTREAM_IMAGE:-joysafeter-egress-mock-upstream:latest}
    build:
      context: ./mock-upstream
      args:
        GO_IMAGE: ${MOCK_UPSTREAM_GO_IMAGE:-docker.m.daocloud.io/library/golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651}
    container_name: joysafeter-egress-mock-upstream
    restart: unless-stopped
    environment:
      HTTP_PORT: "8080"
    expose:
      - "8080"
    networks:
      - joysafeter-network

  # Controller reads the REAL Postgres desired-state (not the file snapshot).
  # On Docker's isolated bridge the ext_authz plane is PLAINTEXT (like XDS),
  # pointing at the orchestrator's ext_authz server — the K8s defaults reference
  # mTLS cert paths that do not exist in the Docker Envoy, which Envoy NACKs.
  joysafeter-egress-controller:
    environment:
      JOYSAFETER_EGRESS_CONTROLLER_SOURCE: postgres
      JOYSAFETER_EGRESS_AUTHZ_HOST: joysafeter-orchestrator
      JOYSAFETER_EGRESS_AUTHZ_PORT: "18090"
      JOYSAFETER_EGRESS_AUTHZ_MTLS: "false"

  # Orchestrator drives the durable authority + points Docker Envoy at the
  # controller + runs the ext_authz credential server (plaintext on the bridge).
  orchestrator-rs:
    environment:
      JOYSAFETER_ENVOY_XDS_MODE: controller
      JOYSAFETER_EGRESS_POLICY_AUTHORITY_ENABLED: "true"
      JOYSAFETER_EGRESS_CONTROLLER_XDS_HOST: joysafeter-egress-controller
      JOYSAFETER_EGRESS_CONTROLLER_XDS_PORT: "18000"
      JOYSAFETER_EGRESS_POLICY_HOST_ID: docker-local
      JOYSAFETER_EGRESS_AUTHZ_BIND: 0.0.0.0:18090
      JOYSAFETER_EGRESS_AUTHZ_MTLS: "false"
      # Platform allowlist of model hosts eligible for credential injection —
      # distinct from an Environment's networking allowed_hosts. The mock
      # upstream must be here or extract_llm_egress skips injection and leaves
      # the sandbox pointed at the raw upstream.
      JOYSAFETER_LLM_EGRESS_ALLOWED_HOSTS: joysafeter-egress-mock-upstream
