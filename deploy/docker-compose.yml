# =============================================================================
# JoySafeter 三服务容器化部署（本地 PostgreSQL / 云 Redis）
# =============================================================================
# 用法：
#   cd deploy
#   Supported local stack:
#     ./deploy.sh local
#     docker compose --profile local-redis --profile rust-orchestrator up -d --no-build
# =============================================================================

x-backend-build: &backend-build
  context: ../backend
  dockerfile: ../deploy/docker/backend.Dockerfile
  args:
    BASE_IMAGE_REGISTRY: ${BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library/}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
    UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
    GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}

x-orchestrator-rs-build: &orchestrator-rs-build
  context: ..
  dockerfile: deploy/docker/orchestrator-rs.Dockerfile
  args:
    RUST_IMAGE: ${RUST_IMAGE:-public.ecr.aws/docker/library/rust:1-bookworm}
    RUNTIME_IMAGE: ${RUNTIME_IMAGE:-public.ecr.aws/docker/library/debian:bookworm-slim}

x-skillspector-build: &skillspector-build
  context: ../backend/joysafeter_skillspector
  dockerfile: ../../deploy/docker/skillspector-service.Dockerfile
  additional_contexts:
    skillspector: ${SKILLSPECTOR_SOURCE_PATH:-../.deps/SkillSpector}
  args:
    BASE_IMAGE_REGISTRY: ${BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library/}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}

x-backend-env-files: &backend-env-files
  - path: ../backend/.env
    required: false
  - path: .env
    required: false

x-backend-common-env: &backend-common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-["${FRONTEND_URL:-http://localhost:3000}"]}
  JOYSAFETER_ENVOY_IMAGE: ${JOYSAFETER_ENVOY_IMAGE:-${DOCKER_MIRROR:-docker.m.daocloud.io}/envoyproxy/envoy:v1.37.1}
  IDENTITY_FEDERATION_PROVIDERS: ${IDENTITY_FEDERATION_PROVIDERS:-}
  IDENTITY_FEDERATION_CONFIG_PATH: ${IDENTITY_FEDERATION_CONFIG_PATH:-}
  IDENTITY_FEDERATION_LOGIN_MODE: ${IDENTITY_FEDERATION_LOGIN_MODE:-chooser}
  AGENT_IDENTITY_PROVIDER: ${AGENT_IDENTITY_PROVIDER:-none}
  AGENT_IDENTITY_BASE_URL: ${AGENT_IDENTITY_BASE_URL:-}
  AGENT_IDENTITY_ALLOWED_HOSTS: ${AGENT_IDENTITY_ALLOWED_HOSTS:-}
  AGENT_IDENTITY_COOKIE_NAME: ${AGENT_IDENTITY_COOKIE_NAME:-}
  AGENT_IDENTITY_CONTEXT_TTL_SECONDS: ${AGENT_IDENTITY_CONTEXT_TTL_SECONDS:-300}
  CREDENTIAL_DEPENDENCY_REGISTRY_MODE: ${CREDENTIAL_DEPENDENCY_REGISTRY_MODE:-enforce}

  # File storage. Local volume is OK for one host; set STORAGE_BACKEND=s3/oss for shared storage.
  JOYSAFETER_MAX_UPLOAD_FILE_BYTES: ${JOYSAFETER_MAX_UPLOAD_FILE_BYTES:-52428800}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/data/files}
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
  STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
  STORAGE_OSS_BUCKET: ${STORAGE_OSS_BUCKET:-}
  STORAGE_OSS_ENDPOINT: ${STORAGE_OSS_ENDPOINT:-}
  STORAGE_OSS_REGION: ${STORAGE_OSS_REGION:-}
  STORAGE_OSS_ACCESS_KEY: ${STORAGE_OSS_ACCESS_KEY:-}
  STORAGE_OSS_SECRET_KEY: ${STORAGE_OSS_SECRET_KEY:-}

x-backend-volumes: &backend-volumes
  - backend-logs:/app/app/logs
  - backend-files:/app/data/files
  - ../skills:/app/skills:ro
  - ${JOYSAFETER_RUNNER_CONTROL_SOCKET_HOST_DIR:-/tmp/joysafeter-runner-control}:${JOYSAFETER_RUNNER_CONTROL_SOCKET_HOST_DIR:-/tmp/joysafeter-runner-control}
  - ${JOYSAFETER_ENVOY_SOCKET_HOST_DIR:-/tmp/joysafeter-sockets}:${JOYSAFETER_ENVOY_SOCKET_HOST_DIR:-/tmp/joysafeter-sockets}
  - ${JOYSAFETER_ENVOY_CONFIG_DIR:-/tmp/joysafeter-envoy-config}:${JOYSAFETER_ENVOY_CONFIG_DIR:-/tmp/joysafeter-envoy-config}

x-backend-depends: &backend-depends
  postgres:
    condition: service_healthy
  skillspector:
    condition: service_healthy

x-backend-health-common: &backend-health-common
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 180s

services:
  joysafeter-envoy:
    image: ${JOYSAFETER_ENVOY_IMAGE:-${DOCKER_MIRROR:-docker.m.daocloud.io}/envoyproxy/envoy:v1.37.1}
    container_name: ${JOYSAFETER_ENVOY_CONTAINER_NAME:-joysafeter-envoy}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        set -eu
        mkdir -p /sockets /envoy-config/sandboxes
        if [ ! -s /envoy-config/lds.json ]; then
          printf '{"version_info":"0","resources":[]}\n' > /envoy-config/lds.json
        fi
        if [ ! -s /envoy-config/cds.json ]; then
          printf '{"version_info":"0","resources":[]}\n' > /envoy-config/cds.json
        fi
        while [ ! -s /envoy-config/bootstrap.json ]; do
          sleep 0.2
        done
        exec envoy -c /envoy-config/bootstrap.json --log-level ${JOYSAFETER_ENVOY_LOG_LEVEL:-info}
    volumes:
      # Egress sockets MUST use the same storage the orchestrator and sandboxes
      # use. The orchestrator (volume mode, the default) creates per-sandbox dirs
      # in the `joysafeter-sockets` named volume and mounts that volume (subpath)
      # into each sandbox, so Envoy must mount the very same volume here. Binding a
      # host path instead put Envoy on a different filesystem, so it could not bind
      # the per-sandbox listener pipes and all egress silently failed.
      - joysafeter-sockets:/sockets
      - ${JOYSAFETER_ENVOY_CONFIG_DIR:-/tmp/joysafeter-envoy-config}:/envoy-config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - joysafeter-network

  skillspector:
    image: ${SKILLSPECTOR_FULL_IMAGE:-joysafeter-skillspector:latest}
    build: *skillspector-build
    container_name: joysafeter-skillspector
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SKILLSPECTOR_VERSION: ${SKILLSPECTOR_VERSION:-local}
      SKILLSPECTOR_SERVICE_SCAN_TIMEOUT: ${SKILLSPECTOR_SERVICE_SCAN_TIMEOUT:-120}
      SKILLSPECTOR_SERVICE_MAX_FILES: ${SKILLSPECTOR_SERVICE_MAX_FILES:-100}
      SKILLSPECTOR_SERVICE_MAX_FILE_BYTES: ${SKILLSPECTOR_SERVICE_MAX_FILE_BYTES:-1048576}
      SKILLSPECTOR_SERVICE_MAX_TOTAL_BYTES: ${SKILLSPECTOR_SERVICE_MAX_TOTAL_BYTES:-5242880}
      # Concurrency: scans are CPU-bound (semgrep), so worker count should
      # track the CPU limit below. limit-concurrency sheds load past a small
      # queue. Draft-save paths may record failed/scanning and continue;
      # optional enforcement applies only to the publish boundary.
      SKILLSPECTOR_WORKERS: ${SKILLSPECTOR_WORKERS:-2}
      SKILLSPECTOR_LIMIT_CONCURRENCY: ${SKILLSPECTOR_LIMIT_CONCURRENCY:-4}
    expose:
      - "8010"
    deploy:
      resources:
        limits:
          # Keep CPU limit == SKILLSPECTOR_WORKERS so each worker gets a core.
          cpus: "${SKILLSPECTOR_CPUS:-2}"
          memory: ${SKILLSPECTOR_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - joysafeter-network

  postgres:
    image: ${DB_IMAGE:-public.ecr.aws/docker/library/postgres:15}
    container_name: joysafeter-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-joysafeter}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - joysafeter-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-joysafeter}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - joysafeter-network

  redis:
    profiles: ["local-redis"]
    image: ${REDIS_IMAGE:-public.ecr.aws/docker/library/redis:alpine3.22}
    container_name: joysafeter-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - joysafeter-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - joysafeter-network

  api:
    image: ${BACKEND_FULL_IMAGE:-joysafeter-backend:latest}
    build: *backend-build
    container_name: joysafeter-api
    restart: unless-stopped
    env_file: *backend-env-files
    environment:
      <<: *backend-common-env
      JOYSAFETER_SERVICE_ROLE: api
      BACKEND_APP_MODULE: app.joysafeter_api.main:app
      BACKEND_PORT: 8000
      WORKERS: ${API_WORKERS:-1}
    ports:
      - "${BACKEND_BIND_HOST:-0.0.0.0}:${BACKEND_PORT_HOST:-8000}:8000"
    depends_on: *backend-depends
    volumes: *backend-volumes
    healthcheck:
      <<: *backend-health-common
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
    networks:
      - joysafeter-network

  orchestrator-rs:
    profiles: ["rust-orchestrator"]
    image: ${ORCHESTRATOR_RS_FULL_IMAGE:-joysafeter-orchestrator-rs:latest}
    build: *orchestrator-rs-build
    container_name: joysafeter-orchestrator
    restart: unless-stopped
    env_file: *backend-env-files
    environment:
      <<: *backend-common-env
      JOYSAFETER_INSTANCE_ID: ${JOYSAFETER_INSTANCE_ID:-orchestrator-rs-001}
      JOYSAFETER_GRPC_HOST: 0.0.0.0
      JOYSAFETER_GRPC_PORT: ${JOYSAFETER_GRPC_PORT:-9090}
      JOYSAFETER_GRPC_PUBLIC_URL: ${JOYSAFETER_GRPC_PUBLIC_URL:-http://host.docker.internal:9090}
    ports:
      - "${JOYSAFETER_GRPC_BIND_HOST:-0.0.0.0}:${JOYSAFETER_GRPC_PORT_HOST:-9090}:9090"
    depends_on:
      <<: *backend-depends
      joysafeter-envoy:
        condition: service_started
    volumes:
      - backend-logs:/app/app/logs
      - backend-files:/app/data/files
      - ../skills:/app/skills:ro
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ${JOYSAFETER_SANDBOX_WORKSPACE_ROOT:-/tmp/joysafeter-workspaces}:${JOYSAFETER_SANDBOX_WORKSPACE_ROOT:-/tmp/joysafeter-workspaces}
      - ${JOYSAFETER_RUNNER_CONTROL_SOCKET_HOST_DIR:-/tmp/joysafeter-runner-control}:${JOYSAFETER_RUNNER_CONTROL_SOCKET_HOST_DIR:-/tmp/joysafeter-runner-control}
      - ${JOYSAFETER_ENVOY_SOCKET_HOST_DIR:-/tmp/joysafeter-sockets}:${JOYSAFETER_ENVOY_SOCKET_HOST_DIR:-/tmp/joysafeter-sockets}
      - ${JOYSAFETER_ENVOY_CONFIG_DIR:-/tmp/joysafeter-envoy-config}:${JOYSAFETER_ENVOY_CONFIG_DIR:-/tmp/joysafeter-envoy-config}
    # Liveness only: the orchestrator speaks gRPC (no HTTP/gRPC-health service),
    # so probe that the gRPC listener is accepting TCP. A crash-looping
    # orchestrator stops listening and turns unhealthy instead of the stack
    # reporting fully healthy. Relies on bash /dev/tcp, present and enabled in
    # the default debian:bookworm-slim RUNTIME_IMAGE.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - joysafeter-network

  worker:
    image: ${BACKEND_FULL_IMAGE:-joysafeter-backend:latest}
    build: *backend-build
    # No container_name: the worker hosts the cron scheduler, which is
    # multi-instance-safe (FOR UPDATE SKIP LOCKED claim + stale-lock reclaim +
    # hostname-derived worker_id) and the event-stream consumer (Redis consumer
    # group + per-instance consumer name). Omitting container_name lets it scale:
    #   docker compose ... up -d --scale worker=3
    # See deploy/HA.md. WORKERS stays 1 (one scheduler loop per container);
    # scale by adding container replicas, not uvicorn workers.
    restart: unless-stopped
    env_file: *backend-env-files
    environment:
      <<: *backend-common-env
      JOYSAFETER_SERVICE_ROLE: worker
      BACKEND_APP_MODULE: app.joysafeter_worker.main:app
      BACKEND_PORT: 8002
      WORKER_HTTP_HOST: 0.0.0.0
      WORKERS: 1
    # Health port is exposed on the compose network (not published to a fixed
    # host port) so N replicas don't collide on one host. Reach it via
    # `docker compose exec worker curl localhost:8002/health` or the compose
    # healthcheck below.
    expose:
      - "8002"
    depends_on: *backend-depends
    volumes: *backend-volumes
    healthcheck:
      <<: *backend-health-common
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)"]
    networks:
      - joysafeter-network

  frontend:
    image: ${FRONTEND_FULL_IMAGE:-joysafeter-frontend:latest}
    build:
      context: ../frontend
      dockerfile: ../deploy/docker/frontend.Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library/}
    container_name: joysafeter-frontend
    restart: unless-stopped
    env_file:
      - path: ../frontend/.env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_URL: ${FRONTEND_URL:-http://localhost:3000}
      NEXT_PUBLIC_CSP_NECESSARY_DOMAIN: ${NEXT_PUBLIC_CSP_NECESSARY_DOMAIN:-http://localhost:* http://127.0.0.1:*}
      NEXT_PUBLIC_EMAIL_PASSWORD_SIGNUP_ENABLED: ${NEXT_PUBLIC_EMAIL_PASSWORD_SIGNUP_ENABLED:-true}
      NEXT_PUBLIC_MAX_UPLOAD_FILE_BYTES: ${NEXT_PUBLIC_MAX_UPLOAD_FILE_BYTES:-52428800}
    ports:
      - "${FRONTEND_BIND_HOST:-0.0.0.0}:${FRONTEND_PORT_HOST:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - joysafeter-network

  db-init:
    image: ${BACKEND_FULL_IMAGE:-joysafeter-backend:latest}
    build: *backend-build
    container_name: joysafeter-db-init
    profiles: ["init"]
    env_file: *backend-env-files
    environment:
      <<: *backend-common-env
    depends_on: *backend-depends
    command: ["sh", "-c", "alembic upgrade head"]
    volumes: *backend-volumes
    networks:
      - joysafeter-network

volumes:
  joysafeter-db-data:
    driver: local
  joysafeter-redis-data:
    driver: local
  backend-logs:
    driver: local
  backend-files:
    driver: local
    name: joysafeter-backend-files
  joysafeter-sockets:
    driver: local
    name: ${JOYSAFETER_ENVOY_SOCKET_VOLUME:-joysafeter-sockets}

networks:
  joysafeter-network:
    name: joysafeter-network
    driver: bridge
