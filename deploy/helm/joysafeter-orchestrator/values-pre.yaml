# =============================================================================
# 预发环境 (values-pre.yaml)
# =============================================================================
# 部署前先手工创建两个 Secret (只需一次,一般不变):
#
#   # 1. 私有仓库拉取凭证
#   kubectl create namespace joysafeter-pre
#   kubectl create secret docker-registry aisec-repo-cred -n joysafeter-pre \
#     --docker-server=aisec-repo.jd.com \
#     --docker-username=<账号> --docker-password=<密码>
#
#   # 2. DB/Redis/Vault 凭证
#   kubectl create secret generic joysafeter-secrets-pre -n joysafeter-pre \
#     --from-literal=POSTGRES_HOST=pgm-xxx-pre.pg.rds.jdcloud.com \
#     --from-literal=POSTGRES_PORT=5432 \
#     --from-literal=POSTGRES_USER=joysafeter \
#     --from-literal=POSTGRES_PASSWORD='<密码>' \
#     --from-literal=POSTGRES_DB=joysafeter_pre \
#     --from-literal=REDIS_HOST=redis-xxx-pre.redis.rds.jdcloud.com \
#     --from-literal=REDIS_PORT=6379 \
#     --from-literal=REDIS_PASSWORD='<密码>' \
#     --from-literal=REDIS_DB=0 \
#     --from-literal=JOYSAFETER_XDS_AUTH_KEYRING='{"active-2026-08":"<openssl rand -hex 32>"}' \
#     --from-literal=JOYSAFETER_XDS_AUTH_WRITE_KEY_ID='active-2026-08' \
#     --from-literal=JOYSAFETER_XDS_AUTH_TOKEN='<same token selected by write key id>' \
#     --from-literal=JOYSAFETER_VAULT_ENCRYPTION_KEY='<openssl rand -base64 32>' \
#     --from-literal=JOYSAFETER_CREDENTIAL_ENCRYPTION_KEYRING='{"active-2026-08":"<key>"}' \
#     --from-literal=JOYSAFETER_CREDENTIAL_ENCRYPTION_WRITE_KEY_ID='active-2026-08' \
#     --from-literal=STORAGE_S3_BUCKET='joysafeter-files-pre' \
#     --from-literal=STORAGE_S3_ENDPOINT='https://<s3-internal-endpoint>' \
#     --from-literal=STORAGE_S3_REGION='<s3 region, optional>' \
#     --from-literal=STORAGE_S3_ACCESS_KEY='<s3 access key>' \
#     --from-literal=STORAGE_S3_SECRET_KEY='<s3 secret key>' \
#     --from-literal=JD_AGENT_IDENTITY_CLIENT_SECRET='<identity client secret>'
#
# 部署: helm install joysafeter-pre . -f values-pre.yaml -n joysafeter-pre
# =============================================================================

namespace: joysafeter-pre
environment: pre

# 引用手工创建的 Secret (不在此写明文)
externalSecret: joysafeter-secrets-pre

# 私有仓库拉取凭证名 (手工创建的 docker-registry Secret)
image:
  imagePullSecrets:
    - aisec-repo-cred


# ── Orchestrator ──
orchestrator:
  replicas: 2

  # ── 文件存储 ──
  # 线上使用 S3。bucket/endpoint/accessKey/secretKey 可放 externalSecret；
  # 也可以在私有 values 覆盖 orchestrator.storage.s3.bucket/orchestrator.storage.s3.endpoint。
  storage:
    backend: s3
    s3:
      bucket: ""
      endpoint: ""
      region: ""

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

  grpc:
    port: 9090
    maxConnections: 1000
    maxExecutions: 500

  xds:
    port: 9092

  scheduling:
    maxConcurrentTasks: 100
    maxSchedulingTasks: 50
    batchSize: 5

  sandbox:
    idleTimeout: 120
    stoppedTTL: 300
    hardTimeout: 3600
    bridgeDisconnectGrace: 30
    failureThreshold: 3

  pool:
    enabled: true
    minSize: 2
    maxAge: 600

  logLevel: debug

# Set provider to jd only after replacing these values and adding the client secret above.
agentIdentity:
  provider: none
  baseUrl: ""
  allowedHosts: []
  cookieName: ""
  contextTtlSeconds: 300
  clientId: ""
  platformId: ""

# ── Envoy ──
envoy:
  enabled: true
  xdsMode: grpc
  socketHostDir: /data/joysafeter-pre/envoy-sockets

# ── Egress 白名单 ──
egress:
  allowedHosts:
    - ai-api.jdcloud.com
