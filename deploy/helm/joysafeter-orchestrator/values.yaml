# =============================================================================
# JoySafeter Orchestrator Helm Values — 默认值 (通用基础)
# =============================================================================
# 使用对应环境 values 与镜像锁文件安装，完整命令见 README.md。
# =============================================================================

# ── 全局 ──
environment: dev   # dev / pre / production
timezone: Asia/Shanghai

# Namespace-level safety ceiling. CPU/memory quota is intentionally not enabled
# until every dynamically-created sandbox/init container declares requests.
resourceQuota:
  enabled: true
  hard:
    pods: "50"
    services: "20"
    configmaps: "100"
    secrets: "100"
    persistentvolumeclaims: "20"

# ── 镜像 ──
image:
  orchestrator: aisec-repo.jd.com/joysafeter/joysafeter-orchestrator-rs:latest
  agentGateway: aisec-repo.jd.com/joysafeter/joysafeter-agent-gateway:latest
  envoy: aisec-repo.jd.com/joysafeter/joysafeter-envoy:v1.37.1
  sandbox:
    claude: aisec-repo.jd.com/joysafeter/joysafeter-claudecode:latest
    codex: aisec-repo.jd.com/joysafeter/joysafeter-codex:latest
    native: aisec-repo.jd.com/joysafeter/joysafeter-native:latest
    pi: aisec-repo.jd.com/joysafeter/joysafeter-pi:latest
  pullPolicy: Always
  # 私有仓库拉取凭证名 (被所有 pod 引用)
  imagePullSecrets:
    - aisec-repo-cred

# ── 私有仓库账号 (可选) ──
# 配了则 Helm 自动生成 docker-registry Secret (名字 = secretName)
# 不配则需手动创建:
#   kubectl create secret docker-registry aisec-repo-cred -n <ns> \
#     --docker-server=aisec-repo.jd.com --docker-username=xxx --docker-password=xxx
# imageRegistry:
#   secretName: aisec-repo-cred
#   server: aisec-repo.jd.com
#   username: "your-user"
#   password: "your-password"

# ── 外部依赖 (通过 Secret 注入) ──
# 方式 1: 在 values-{env}.yaml 中配置 database/redis → 自动生成 Secret
# 方式 2: 手动 kubectl create secret → 只设 externalSecret 名称
externalSecret: joysafeter-secrets

# ── 数据库 (可选,配了则自动生成 Secret) ──
# database:
#   host: pg-host
#   port: 5432
#   user: joysafeter
#   password: "your-password"
#   name: joysafeter

# ── Redis (可选,配了则自动生成 Secret) ──
# redis:
#   host: redis-host
#   port: 6379
#   password: "your-password"
#   db: 0

# ── 凭据加密 keyring（新部署使用）──
# 每把 key 生成方式: openssl rand -base64 32。启用 keyring 时 writeKeyId 必填。
# credentialEncryptionKeyring: '{"active-2026-08":"...","previous-2026-07":"..."}'
# credentialEncryptionWriteKeyId: "active-2026-08"
# 仅迁移仍含 enc:/enc:v1: 数据的旧部署需要暂时保留：
# vaultEncryptionKey: "legacy-base64-key"

# ── xDS 控制面认证（也可放入 externalSecret）──
# keyring 接受当前 token 与有限数量的轮换期旧 token；token 必须等于 writeKeyId 选中的值。
xdsAuth:
  keyring: ""
  writeKeyId: ""
  token: ""

# 独立 Agent Gateway。Orchestrator 是唯一持久真相；Gateway 保存可丢弃的
# 内存 xDS 投影，resolved UserToken/AgentToken 只经管理面进入 Gateway/Envoy 内存。
agentGateway:
  replicas: 3
  managementToken: ""
  # Dedicated replica-to-replica token. Snapshots contain credential
  # material, so isolate this channel and enable mesh mTLS in production.
  replicationToken: ""
  hotStandbyMinAcks: 1
  replicationAckTimeoutMs: 1000
  deliveryTimeoutSeconds: 20
  # Orchestrator HTTP timeout must cover Gateway Envoy-ACK delivery plus
  # follower replication acknowledgement and transport overhead.
  requestTimeoutSeconds: 25
  shutdownGraceSeconds: 10
  leaderLeaseName: joysafeter-agent-gateway
  leaderLeaseDurationSeconds: 15
  leaderRenewIntervalSeconds: 5
  # Required with standard NetworkPolicy; use the Kubernetes Service/API CIDR.
  # Cilium installations use the kube-apiserver entity instead.
  kubernetesApiCidrs: []
  nodeVisibility: node_scoped
  xdsPort: 9092
  httpPort: 9093
  # gRPC management port. Orchestrator calls ApplyPolicy/RemovePolicy here
  # (type-safe, high-performance path replacing the HTTP management API).
  managementGrpcPort: 9094
  # gRPC policy stream endpoint (optional). When set, gateway subscribes to
  # real-time policy events from orchestrator instead of polling HTTP.
  # Example: "grpc://joysafeter-orchestrator.default.svc.cluster.local:50051"
  policyStreamEndpoint: ""
  # Transport identity and certificate rotation are delegated to the mesh.
  # Add its sidecar injection annotation here and enforce strict mTLS in the
  # mesh policy; application-level tokens remain enabled as defense in depth.
  podAnnotations: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  resources:
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "2"
      memory: "512Mi"

# ═══════════════════════════════════════════════════════════════════════════════
# Orchestrator Deployment
# ═══════════════════════════════════════════════════════════════════════════════

orchestrator:
  replicas: 3

  priorityClassName: ""
  nodeSelector: {}
  tolerations: []

  # Applied to dynamically-created sandbox Pods. Keep this aligned with the
  # Envoy DaemonSet because managed egress uses a node-local Unix socket.
  sandboxPlacement:
    priorityClassName: ""
    nodeSelector: {}
    tolerations: []

  # ── 文件存储 ──
  # API 写文件，orchestrator-rs 读 session 文件；两边必须使用同一套配置。
  # 支持: local / s3 / oss。线上多 Pod 推荐 oss/s3，避免 pod 本地盘不一致。
  storage:
    backend: local

    local:
      path: /data/files
      persistence:
        enabled: false
        existingClaim: ""
        storageClassName: ""
        accessModes:
          - ReadWriteMany
        size: 100Gi

    s3:
      bucket: ""
      endpoint: ""
      region: ""
      accessKey: ""
      secretKey: ""

    oss:
      bucket: ""
      endpoint: ""
      region: ""
      accessKey: ""
      secretKey: ""


  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "4"
      memory: "4Gi"

  # ── gRPC ──
  grpc:
    port: 9090
    maxConnections: 5000
    maxExecutions: 2000

  # ── 调度 ──
  scheduling:
    maxConcurrentTasks: 500
    maxSchedulingTasks: 300
    batchSize: 10

  # ── 任务超时/租约 ──
  task:
    defaultTimeout: 7200
    leaseTtlSec: 45
    leaseRenewIntervalSec: 10

  # ── Sandbox 生命周期 ──
  sandbox:
    idleTimeout: 300
    stoppedTTL: 3600
    hardTimeout: 21600
    bridgeDisconnectGrace: 90
    failureThreshold: 3

  # ── Sandbox 容器加固 (注入到每个沙箱 Pod) ──
  hardening:
    dropAllCaps: true
    noNewPrivileges: true
    pidsLimit: 256           # 0=不限制; 单机用 0, K8s 建议限制
    runAsUser: "1000:1000"   # 空=用镜像默认 USER

  # ── Sandbox 资源限制 (每个沙箱容器, 空=不限制) ──
  sandboxResources:
    cpu: ""                  # 如 "2" (核数)
    memoryMb: ""             # 如 4096

  # ── 沙箱内存存储上限 ──
  maxMemoriesPerStore: 2000

  # ── 沙箱工作区根目录 (K8s 通常用 PVC, 留空) ──
  sandboxWorkspaceRoot: ""

  # ── 预热池 ──
  pool:
    enabled: true
    minSize: 5
    maxAge: 1800
    # 预热的镜像列表 (留空则用 sandbox.claude 单一镜像)
    images: []
    # images:
    #   - aisec-repo.jd.com/joysafeter/joysafeter-claudecode:latest
    #   - aisec-repo.jd.com/joysafeter/joysafeter-codex:latest

  # ── 事件流 ──
  eventStream:
    enabled: true
    key: "joysafeter:orchestrator:events"
    maxLen: 100000
    fallbackToDb: true

  # ── 数据库连接池 ──
  database:
    poolSize: 20
    minConnections: 5

  # Every environment must use a dedicated Redis instance. The prefix remains
  # a defense-in-depth boundary against accidental endpoint misconfiguration.
  redis:
    keyPrefix: "joysafeter:dev"

  # ── 心跳 ──
  heartbeat:
    interval: 15
    ttl: 30

  # ── 日志 ──
  logLevel: info

# ── Agent Identity (provider: none or jd) ──
agentIdentity:
  provider: none
  baseUrl: ""
  # Namespace-scoped AgentIdentityService resources. Exact DNS names and
  # leading wildcards such as *.dataagent.example.com are supported.
  services: []
  # services:
  #   - name: icc-dataagent-http
  #     host: icc-dataagent-api.jd.com
  #     port: 80
  #     tls: false
  #   - name: trusted-dataagents-https
  #     host: "*.dataagent.jd.com"
  #     port: 443
  #     tls: true
  #     enabled: true
  clientId: ""
  platformId: ""
  authType: SSO
  identityType: ssoTicket
  agentScene: jdcloud_box_skill
  userTokenCookieName: ""
  exchangeUserTokenEnabled: true
  clientSecret: ""

# ═══════════════════════════════════════════════════════════════════════════════
# Envoy DaemonSet
# ═══════════════════════════════════════════════════════════════════════════════

envoy:
  enabled: true
  socketHostDir: /data/joysafeter/envoy-sockets
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  runAsUser: 101
  runAsGroup: 101
  terminationGracePeriodSeconds: 40
  drainSeconds: 20

  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "2"
      memory: "512Mi"

# ═══════════════════════════════════════════════════════════════════════════════
# Egress 白名单 (Envoy 允许出站的 LLM/MCP 域名)
# ═══════════════════════════════════════════════════════════════════════════════

egress:
  allowedHosts:
    - ai-api.jdcloud.com

# ═══════════════════════════════════════════════════════════════════════════════
# NetworkPolicy (Cilium)
# ═══════════════════════════════════════════════════════════════════════════════

networkPolicy:
  enabled: true
  type: cilium   # cilium (CiliumNetworkPolicy) / standard (K8s NetworkPolicy)

# ═══════════════════════════════════════════════════════════════════════════════
# 生产告警（依赖 Prometheus Operator；xDS 节点数量告警还依赖 kube-state-metrics）
# ═══════════════════════════════════════════════════════════════════════════════

monitoring:
  xdsAlerts:
    enabled: false
    additionalLabels: {}
    authorityUnavailableFor: 40s
    recoveryBudgetSeconds: 30
    recoveryOverBudgetFor: 1m
    nackWindow: 5m
    nackFor: 5m
    applyTimeoutSeconds: 30
    degradedInventoryFor: 30s
    envoyNodeMismatchFor: 2m
  runnerAlerts:
    enabled: false
    additionalLabels: {}
    setupFailureWindow: 5m
    setupFailureFor: 5m
    reconnectRejectWindow: 10m
    reconnectRejectFor: 2m
    staleResultWindow: 10m
    staleResultFor: 5m
