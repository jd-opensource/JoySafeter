# =============================================================================
# JoySafeter Orchestrator Helm Values — 默认值 (通用基础)
# =============================================================================
# 使用方式:
#   helm install joysafeter-test . -f values-test.yaml
#   helm install joysafeter-prod . -f values-prod.yaml
# =============================================================================

# ── 全局 ──
namespace: joysafeter
environment: production   # test / production
timezone: Asia/Shanghai

# ── 镜像 ──
image:
  orchestrator: aisec-repo.jd.com/joysafeter/joysafeter-orchestrator-rs:latest
  envoy: aisec-repo.jd.com/joysafeter/joysafeter-envoy:v1.37.1
  sandbox:
    claude: aisec-repo.jd.com/joysafeter/joysafeter-claudecode:latest
    codex: aisec-repo.jd.com/joysafeter/joysafeter-codex:latest
    native: aisec-repo.jd.com/joysafeter/joysafeter-native:latest
  pullPolicy: Always
  # 私有仓库拉取凭证名 (被所有 pod 引用)
  imagePullSecrets:
    - aisec-repo-cred

# ── 私有仓库账号 (可选) ──
# 配了则 Helm 自动生成 docker-registry Secret (名字 = secretName)
# 不配则需手动创建:
#   kubectl create secret docker-registry aisec-repo-cred -n <ns> \
#     --docker-server=aisec-repo.jd.com --docker-username=xxx --docker-password=xxx
# imageRegistry:
#   secretName: aisec-repo-cred
#   server: aisec-repo.jd.com
#   username: "your-user"
#   password: "your-password"

# ── 外部依赖 (通过 Secret 注入) ──
# 方式 1: 在 values-{env}.yaml 中配置 database/redis → 自动生成 Secret
# 方式 2: 手动 kubectl create secret → 只设 externalSecret 名称
externalSecret: joysafeter-secrets

# ── 数据库 (可选,配了则自动生成 Secret) ──
# database:
#   host: pg-host
#   port: 5432
#   user: joysafeter
#   password: "your-password"
#   name: joysafeter

# ── Redis (可选,配了则自动生成 Secret) ──
# redis:
#   host: redis-host
#   port: 6379
#   password: "your-password"
#   db: 0

# ── Vault 加密密钥 (可选,配了则写入 Secret) ──
# 生成: openssl rand -base64 32
# vaultEncryptionKey: "your-base64-key"

# ── HA 模式 ──
haMode: multi   # standalone / leader / multi

# ═══════════════════════════════════════════════════════════════════════════════
# Orchestrator Deployment
# ═══════════════════════════════════════════════════════════════════════════════

orchestrator:
  replicas: 3

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "4"
      memory: "4Gi"

  # ── gRPC ──
  grpc:
    port: 9090
    maxConnections: 5000
    maxExecutions: 2000

  # ── 调度 ──
  scheduling:
    maxConcurrentTasks: 500
    maxSchedulingTasks: 300
    batchSize: 10

  # ── 任务重试/租约 ──
  task:
    defaultTimeout: 7200
    defaultMaxRetries: 2
    leaseTtlSec: 45
    leaseRenewIntervalSec: 10

  # ── Sandbox 生命周期 ──
  sandbox:
    idleTimeout: 300
    stoppedTTL: 3600
    hardTimeout: 21600
    bridgeDisconnectGrace: 90
    failureThreshold: 3

  # ── Sandbox 容器加固 (注入到每个沙箱 Pod) ──
  hardening:
    dropAllCaps: true
    noNewPrivileges: true
    pidsLimit: 256           # 0=不限制; 单机用 0, K8s 建议限制
    runAsUser: "1000:1000"   # 空=用镜像默认 USER

  # ── Sandbox 资源限制 (每个沙箱容器, 空=不限制) ──
  sandboxResources:
    cpu: ""                  # 如 "2" (核数)
    memoryMb: ""             # 如 4096
    diskMb: ""               # 如 10240

  # ── 沙箱内存存储上限 ──
  maxMemoriesPerStore: 2000

  # ── 沙箱工作区根目录 (K8s 通常用 PVC, 留空) ──
  sandboxWorkspaceRoot: ""

  # ── 预热池 ──
  pool:
    enabled: true
    minSize: 5
    maxAge: 1800
    # 预热的镜像列表 (留空则用 sandbox.claude 单一镜像)
    images: []
    # images:
    #   - aisec-repo.jd.com/joysafeter/joysafeter-claudecode:latest
    #   - aisec-repo.jd.com/joysafeter/joysafeter-codex:latest

  # ── 事件流 ──
  eventStream:
    enabled: true
    key: "joysafeter:orchestrator:events"
    group: "joysafeter-orchestrator-event-workers"
    maxLen: 100000
    batchSize: 100
    blockMs: 1000
    fallbackToDb: true

  # ── 数据库连接池 ──
  database:
    poolSize: 20
    minConnections: 5

  # ── 心跳 ──
  heartbeat:
    interval: 15
    ttl: 30

  # ── Leader 模式 (仅 haMode=leader 时) ──
  leader:
    leaseName: joysafeter-orchestrator-leader
    leaseDurationSec: 10
    renewIntervalSec: 3

  # ── 日志 ──
  logLevel: info

# ── Agent Identity (fail-closed; enable only after all fields are set) ──
agentIdentity:
  enabled: false
  baseUrl: ""
  allowedHosts: []
  cookieName: ""
  contextTtlSeconds: 300
  clientId: ""
  platformId: ""
  authType: sso
  identityType: cookie
  agentScene: cloud_sandbox_skill
  clientSecret: ""

# ═══════════════════════════════════════════════════════════════════════════════
# Envoy DaemonSet
# ═══════════════════════════════════════════════════════════════════════════════

envoy:
  enabled: true
  xdsMode: grpc
  socketHostDir: /data/joysafeter/envoy-sockets

  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "2"
      memory: "512Mi"

# ═══════════════════════════════════════════════════════════════════════════════
# Egress 白名单 (Envoy 允许出站的 LLM/MCP 域名)
# ═══════════════════════════════════════════════════════════════════════════════

egress:
  allowedHosts:
    - ai-api.jdcloud.com

# ═══════════════════════════════════════════════════════════════════════════════
# NetworkPolicy (Cilium)
# ═══════════════════════════════════════════════════════════════════════════════

networkPolicy:
  enabled: true
  type: cilium   # cilium (CiliumNetworkPolicy) / standard (K8s NetworkPolicy)
