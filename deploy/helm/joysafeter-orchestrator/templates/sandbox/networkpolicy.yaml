{{- if .Values.networkPolicy.enabled }}
{{- if eq .Values.networkPolicy.type "cilium" }}
# Sandbox Pods only reach Orchestrator gRPC and cluster DNS. External traffic
# uses the hostPath Envoy UDS and does not traverse the Pod network.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: joysafeter-sandbox-egress
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: joysafeter-sandbox
  egress:
  - toEndpoints:
    - matchLabels:
        app: joysafeter-orchestrator
    toPorts:
    - ports:
      - port: "{{ .Values.orchestrator.grpc.port }}"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
  ingressDeny:
  - fromEntities:
    - all
{{- else }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: joysafeter-sandbox-deny-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: joysafeter-sandbox
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: joysafeter-orchestrator
    ports:
    - port: {{ .Values.orchestrator.grpc.port }}
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
{{- end }}
{{- end }}
