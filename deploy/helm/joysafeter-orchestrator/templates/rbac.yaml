apiVersion: v1
kind: ServiceAccount
metadata:
  name: joysafeter-orchestrator
  namespace: {{ .Release.Namespace }}
{{- with .Values.image.imagePullSecrets }}
imagePullSecrets:
  {{- range . }}
  - name: {{ . }}
  {{- end }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: joysafeter-orchestrator
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/log", "pods/attach"]
  verbs: ["get", "list", "watch", "create", "delete", "patch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "create", "delete"]
{{- if or (eq .Values.haMode "leader") (eq .Values.haMode "multi") }}
# leases: scheduling leader election (haMode=leader) or xDS leader election
# (haMode=multi — Envoy control plane converges to one replica).
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: joysafeter-orchestrator
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: joysafeter-orchestrator
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: joysafeter-orchestrator
  apiGroup: rbac.authorization.k8s.io
