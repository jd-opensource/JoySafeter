apiVersion: v1
kind: ServiceAccount
metadata:
  name: joysafeter-orchestrator
  namespace: {{ .Values.namespace }}
{{- with .Values.image.imagePullSecrets }}
imagePullSecrets:
  {{- range . }}
  - name: {{ . }}
  {{- end }}
{{- end }}

# 注意: sandbox Pod 由 orchestrator 用 default SA 创建, 需要 default SA 带
# imagePullSecrets 才能拉私有镜像。default SA 是 K8s 自建、非 Helm 管理,
# 无法由 chart 接管, 部署前手工 patch 一次 (见 README):
#   kubectl patch serviceaccount default -n <ns> \
#     -p '{"imagePullSecrets":[{"name":"aisec-repo-cred"}]}'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: joysafeter-orchestrator
  namespace: {{ .Values.namespace }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/log", "pods/attach"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "create", "delete"]
{{- if eq .Values.haMode "leader" }}
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: joysafeter-orchestrator
  namespace: {{ .Values.namespace }}
subjects:
- kind: ServiceAccount
  name: joysafeter-orchestrator
  namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: joysafeter-orchestrator
  apiGroup: rbac.authorization.k8s.io
