{{- $storage := .Values.orchestrator.storage | default dict -}}
{{- $storageBackend := default "local" $storage.backend | lower -}}
{{- $hasStorageSecret := or
  (and (eq $storageBackend "oss") (or $storage.oss.accessKey $storage.oss.secretKey))
  (and (eq $storageBackend "s3") (or $storage.s3.accessKey $storage.s3.secretKey))
-}}
{{- $hasCredentialSecret := or .Values.vaultEncryptionKey .Values.credentialEncryptionKeyring .Values.credentialEncryptionWriteKeyId -}}
{{- $xdsAuth := .Values.xdsAuth | default dict -}}
{{- $hasXdsSecret := or $xdsAuth.keyring $xdsAuth.writeKeyId $xdsAuth.token -}}
{{- $hasSecret := or .Values.database .Values.redis $hasCredentialSecret $hasXdsSecret .Values.agentIdentity.clientSecret $hasStorageSecret -}}
{{- if $hasSecret }}
# Auto-generated Secret from values.*.
# 密码由 orchestrator 内部自动 URL-encode，无需手动处理特殊字符。
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.externalSecret }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  {{- if .Values.database }}
  # ── PostgreSQL (拆分字段,orchestrator 自动组装 URL) ──
  POSTGRES_HOST: {{ .Values.database.host | quote }}
  POSTGRES_PORT: {{ .Values.database.port | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  POSTGRES_DB: {{ .Values.database.name | quote }}
  {{- if .Values.database.ssl }}
  POSTGRES_SSL: {{ .Values.database.ssl | quote }}
  {{- end }}
  {{- end }}

  {{- if .Values.redis }}
  # ── Redis (拆分字段) ──
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  REDIS_DB: {{ .Values.redis.db | quote }}
  {{- if .Values.redis.tls }}
  REDIS_SCHEME: "rediss"
  {{- end }}
  {{- end }}

  {{- if .Values.vaultEncryptionKey }}
  JOYSAFETER_VAULT_ENCRYPTION_KEY: {{ .Values.vaultEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.credentialEncryptionKeyring }}
  JOYSAFETER_CREDENTIAL_ENCRYPTION_KEYRING: {{ .Values.credentialEncryptionKeyring | quote }}
  {{- end }}
  {{- if .Values.credentialEncryptionWriteKeyId }}
  JOYSAFETER_CREDENTIAL_ENCRYPTION_WRITE_KEY_ID: {{ .Values.credentialEncryptionWriteKeyId | quote }}
  {{- end }}
  {{- if $xdsAuth.keyring }}
  JOYSAFETER_XDS_AUTH_KEYRING: {{ $xdsAuth.keyring | quote }}
  {{- end }}
  {{- if $xdsAuth.writeKeyId }}
  JOYSAFETER_XDS_AUTH_WRITE_KEY_ID: {{ $xdsAuth.writeKeyId | quote }}
  {{- end }}
  {{- if $xdsAuth.token }}
  JOYSAFETER_XDS_AUTH_TOKEN: {{ $xdsAuth.token | quote }}
  {{- end }}
  {{- if .Values.agentIdentity.clientSecret }}
  JD_AGENT_IDENTITY_CLIENT_SECRET: {{ .Values.agentIdentity.clientSecret | quote }}
  {{- end }}

  {{- if eq $storageBackend "oss" }}
  # ── OSS Storage ──
  {{- if $storage.oss.accessKey }}
  STORAGE_OSS_ACCESS_KEY: {{ $storage.oss.accessKey | quote }}
  {{- end }}
  {{- if $storage.oss.secretKey }}
  STORAGE_OSS_SECRET_KEY: {{ $storage.oss.secretKey | quote }}
  {{- end }}
  {{- end }}

  {{- if eq $storageBackend "s3" }}
  # ── S3 Storage ──
  {{- if $storage.s3.accessKey }}
  STORAGE_S3_ACCESS_KEY: {{ $storage.s3.accessKey | quote }}
  {{- end }}
  {{- if $storage.s3.secretKey }}
  STORAGE_S3_SECRET_KEY: {{ $storage.s3.secretKey | quote }}
  {{- end }}
  {{- end }}
{{- end }}
