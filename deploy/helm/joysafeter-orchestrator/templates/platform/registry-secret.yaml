{{- if .Values.imageRegistry }}
{{- if .Values.imageRegistry.username }}
# 自动生成 docker-registry Secret (私有仓库拉取凭证)
# 如果不想明文写在 values,删除 imageRegistry 块,改用手动创建:
#   kubectl create secret docker-registry aisec-repo-cred -n <ns> \
#     --docker-server=... --docker-username=... --docker-password=...
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imageRegistry.secretName | default "aisec-repo-cred" }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.imageRegistry.server .Values.imageRegistry.username .Values.imageRegistry.password (printf "%s:%s" .Values.imageRegistry.username .Values.imageRegistry.password | b64enc) | b64enc }}
{{- end }}
{{- end }}
