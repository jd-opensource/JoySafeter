apiVersion: v1
kind: Service
metadata:
  name: joysafeter-orchestrator
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: joysafeter-orchestrator
  ports:
  - port: {{ .Values.orchestrator.grpc.port }}
    targetPort: grpc
    name: grpc
  - port: 9091
    targetPort: health
    name: health

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: joysafeter-orchestrator
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: joysafeter-orchestrator
