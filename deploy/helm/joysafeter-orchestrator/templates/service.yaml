apiVersion: v1
kind: Service
metadata:
  name: joysafeter-orchestrator
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: joysafeter-orchestrator
  ports:
  - port: {{ .Values.orchestrator.grpc.port }}
    targetPort: grpc
    name: grpc
  - port: 9091
    targetPort: health
    name: health

---
# Dedicated xDS Service. Multi mode selects only the current xDS authority;
# standalone/leader mode has exactly one serving orchestrator process.
apiVersion: v1
kind: Service
metadata:
  name: joysafeter-orchestrator-xds
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: joysafeter-orchestrator
    {{- if eq .Values.haMode "multi" }}
    joysafeter-xds-leader: "true"
    {{- end }}
  ports:
  - port: {{ .Values.orchestrator.xds.port }}
    targetPort: xds
    name: xds

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: joysafeter-orchestrator
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ if and (eq .Values.haMode "multi") (ge (int .Values.orchestrator.replicas) 3) }}2{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: joysafeter-orchestrator
