{{- $storage := .Values.orchestrator.storage | default dict -}}
{{- $storageBackend := default "local" $storage.backend | lower -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joysafeter-orchestrator
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      app: joysafeter-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: {{ if eq .Values.haMode "multi" }}1{{ else }}0{{ end }}
  template:
    metadata:
      labels:
        app: joysafeter-orchestrator
        app.kubernetes.io/environment: {{ .Values.environment }}
      annotations:
        # 配置变更时触发滚动更新 (ConfigMap/Secret 内容变了 → pod 重建)
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: joysafeter-orchestrator
      terminationGracePeriodSeconds: 30
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: joysafeter-orchestrator
              topologyKey: kubernetes.io/hostname
      {{- if and (eq $storageBackend "local") $storage.local.persistence.enabled }}
      volumes:
      - name: joysafeter-files
        persistentVolumeClaim:
          claimName: {{ $storage.local.persistence.existingClaim | default "joysafeter-files" | quote }}
      {{- end }}

      containers:
      - name: orchestrator
        image: {{ .Values.image.orchestrator }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.orchestrator.grpc.port }}
          name: grpc
        - containerPort: {{ .Values.orchestrator.xds.port }}
          name: xds
        - containerPort: 9091
          name: health

        # Pod 级动态字段 (必须用 fieldRef,不能进 ConfigMap)
        env:
        - name: JOYSAFETER_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TZ
          value: {{ .Values.timezone | default "Asia/Shanghai" | quote }}

        # 非敏感配置 (ConfigMap) + 敏感配置 (Secret)
        envFrom:
        - configMapRef:
            name: joysafeter-orchestrator-config
        - secretRef:
            name: {{ .Values.externalSecret }}

        {{- if and (eq $storageBackend "local") $storage.local.persistence.enabled }}
        volumeMounts:
        - name: joysafeter-files
          mountPath: {{ $storage.local.path | default "/data/files" | quote }}
        {{- end }}

        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 9091
          periodSeconds: 5
          failureThreshold: 3
          initialDelaySeconds: 5

        livenessProbe:
          httpGet:
            path: /healthz/live
            port: 9091
          periodSeconds: 10
          failureThreshold: 3
          initialDelaySeconds: 10

        resources:
          {{- toYaml .Values.orchestrator.resources | nindent 10 }}
