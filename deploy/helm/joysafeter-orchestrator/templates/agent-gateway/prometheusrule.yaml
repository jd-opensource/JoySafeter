{{- if .Values.monitoring.xdsAlerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: joysafeter-agent-gateway-xds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "joysafeter.labels" . | nindent 4 }}
    {{- with .Values.monitoring.xdsAlerts.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
  - name: joysafeter-agent-gateway-xds-control-plane
    rules:
    - alert: JoySafeterXdsAuthorityUnavailable
      expr: absent(joysafeter_xds_authority_phase{phase="ready"}) or max(joysafeter_xds_authority_phase{phase="ready"}) < 1
      for: {{ .Values.monitoring.xdsAlerts.authorityUnavailableFor }}
      labels:
        severity: critical
      annotations:
        summary: JoySafeter xDS authority is not ready
        description: No Agent Gateway replica has reported a Ready xDS authority within the configured lease and recovery budget.
    - alert: JoySafeterXdsRecoveryOverBudget
      expr: max(joysafeter_xds_authority_recovery_duration_seconds{result="current"}) > {{ .Values.monitoring.xdsAlerts.recoveryBudgetSeconds }}
      for: {{ .Values.monitoring.xdsAlerts.recoveryOverBudgetFor }}
      labels:
        severity: warning
      annotations:
        summary: JoySafeter xDS recovery exceeded its budget
        description: The active authority remains in staging or recovery serving beyond the configured recovery budget.
    - alert: JoySafeterXdsSustainedNacks
      expr: sum(rate(joysafeter_xds_nack_total[{{ .Values.monitoring.xdsAlerts.nackWindow }}])) > 0
      for: {{ .Values.monitoring.xdsAlerts.nackFor }}
      labels:
        severity: critical
      annotations:
        summary: Envoy is persistently rejecting JoySafeter xDS updates
        description: Sustained NACKs indicate invalid resources or an incompatible Envoy/control-plane contract.
    - alert: JoySafeterXdsDeliveryStalled
      expr: max(joysafeter_xds_oldest_pending_delivery_age_seconds) > {{ .Values.monitoring.xdsAlerts.applyTimeoutSeconds }}
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: JoySafeter xDS delivery is stalled
        description: At least one published policy generation has exceeded the configured apply timeout without a terminal ACK or NACK.
    - alert: JoySafeterXdsDegradedInventory
      expr: max(joysafeter_xds_degraded_inventory) > 0
      for: {{ .Values.monitoring.xdsAlerts.degradedInventoryFor }}
      labels:
        severity: warning
      annotations:
        summary: JoySafeter xDS has degraded sandbox networking
        description: PostgreSQL still contains one or more live limited-networking sandboxes awaiting successful policy application.
    - alert: JoySafeterXdsEnvoyNodeCountMismatch
      expr: max(joysafeter_xds_active_envoy_nodes) != max(kube_daemonset_status_number_available{namespace="{{ .Release.Namespace }}",daemonset="joysafeter-envoy"})
      for: {{ .Values.monitoring.xdsAlerts.envoyNodeMismatchFor }}
      labels:
        severity: warning
      annotations:
        summary: JoySafeter xDS active node count differs from available Envoy pods
        description: The control plane and the Envoy DaemonSet disagree on the number of active nodes.
    - alert: JoySafeterAgentGatewayReplicationQuorumUnavailable
      expr: (max by (namespace,pod) (joysafeter_agent_gateway_replication_required_acknowledgements) - max by (namespace,pod) (joysafeter_agent_gateway_replication_acknowledged_replicas)) > 0
      for: {{ .Values.monitoring.xdsAlerts.replicationQuorumFor }}
      labels:
        severity: critical
      annotations:
        summary: Agent Gateway replication quorum is unavailable
        description: A leader cannot obtain the configured in-memory standby acknowledgement quorum.
    - alert: JoySafeterAgentGatewayReplicationAckLag
      expr: max by (namespace,pod) (joysafeter_agent_gateway_replication_acknowledgement_lag) > 0
      for: {{ .Values.monitoring.xdsAlerts.replicationAckLagFor }}
      labels:
        severity: warning
      annotations:
        summary: Agent Gateway standby is behind the leader
        description: At least one Agent Gateway follower has not acknowledged the current revision.
    - alert: JoySafeterAgentGatewayReplicationLogNearCapacity
      expr: max by (namespace,pod) (joysafeter_agent_gateway_replication_log_entries) > {{ .Values.monitoring.xdsAlerts.replicationLogWarningEntries }}
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: Agent Gateway in-memory replication log is near capacity
        description: A slow follower may soon require a full snapshot instead of delta replay.
    - alert: JoySafeterAgentGatewayPolicyStreamSaturated
      expr: sum by (namespace,pod) (increase(joysafeter_agent_gateway_policy_stream_queue_saturation_total[{{ .Values.monitoring.xdsAlerts.policyStreamSaturationWindow }}])) > 0
      for: {{ .Values.monitoring.xdsAlerts.policyStreamSaturationFor }}
      labels:
        severity: warning
      annotations:
        summary: Agent Gateway policy stream is saturated
        description: Policy commands are being rejected by the configured bounded admission queue.
    - alert: JoySafeterAgentGatewayClientCircuitOpen
      expr: max by (namespace,pod) (joysafeter_orchestrator_agent_gateway_circuit_open) > 0
      for: {{ .Values.monitoring.xdsAlerts.clientCircuitOpenFor }}
      labels:
        severity: critical
      annotations:
        summary: Orchestrator Agent Gateway circuit breaker is open
        description: An Orchestrator has repeatedly failed to reach the Agent Gateway policy stream.
    - alert: JoySafeterAgentGatewayPolicyStreamDisconnected
      expr: max(joysafeter_orchestrator_agent_gateway_policy_stream_connected) < 1
      for: {{ .Values.monitoring.xdsAlerts.policyStreamDisconnectedFor }}
      labels:
        severity: critical
      annotations:
        summary: All Orchestrator policy streams are disconnected
        description: No Orchestrator currently has a connected Agent Gateway policy stream.
{{- end }}
