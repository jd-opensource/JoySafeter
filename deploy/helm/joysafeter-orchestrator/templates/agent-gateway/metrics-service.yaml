{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: joysafeter-agent-gateway-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: joysafeter-agent-gateway
    app.kubernetes.io/name: joysafeter-agent-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: metrics
    app.kubernetes.io/environment: {{ .Values.environment }}
spec:
  clusterIP: None
  selector:
    app: joysafeter-agent-gateway
  ports:
  - name: metrics
    port: {{ .Values.agentGateway.httpPort }}
    targetPort: http
    protocol: TCP
{{- end }}
