{{- if hasKey .Values.agentGateway "enabled" }}
{{- fail "agentGateway.enabled has been removed; the Helm architecture always deploys the independent Agent Gateway" }}
{{- end }}
{{- if hasKey .Values "haMode" }}
{{- fail "haMode has been removed; Helm always runs stateless multi-replica Orchestrator with Agent Gateway owning xDS leadership" }}
{{- end }}
{{- if not .Values.envoy.enabled }}
{{- fail "the independent Agent Gateway architecture requires envoy.enabled=true" }}
{{- end }}
{{- if lt (int .Values.agentGateway.replicas) 1 }}
{{- fail "agentGateway.replicas must be at least 1" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.hotStandbyMinAcks) 0) (gt (int .Values.agentGateway.hotStandbyMinAcks) 32) }}
{{- fail "agentGateway.hotStandbyMinAcks must be between 0 and 32" }}
{{- end }}
{{- if lt (int .Values.agentGateway.replicas) (add (int .Values.agentGateway.hotStandbyMinAcks) 1) }}
{{- fail "agentGateway.replicas must be at least hotStandbyMinAcks + 1" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.deliveryTimeoutSeconds) 1) (gt (int .Values.agentGateway.deliveryTimeoutSeconds) 300) }}
{{- fail "agentGateway.deliveryTimeoutSeconds must be between 1 and 300" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.replicationAckTimeoutMs) 100) (gt (int .Values.agentGateway.replicationAckTimeoutMs) 30000) }}
{{- fail "agentGateway.replicationAckTimeoutMs must be between 100 and 30000" }}
{{- end }}
{{- $replicationAckSeconds := div (add (int .Values.agentGateway.replicationAckTimeoutMs) 999) 1000 }}
{{- $minimumRequestTimeout := add (int .Values.agentGateway.deliveryTimeoutSeconds) $replicationAckSeconds 2 }}
{{- if or (lt (int .Values.agentGateway.requestTimeoutSeconds) $minimumRequestTimeout) (gt (int .Values.agentGateway.requestTimeoutSeconds) 600) }}
{{- fail (printf "agentGateway.requestTimeoutSeconds must be between %d and 600 to cover delivery and replication timeouts" $minimumRequestTimeout) }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.leaderRenewIntervalSeconds) 1) (ge (int .Values.agentGateway.leaderRenewIntervalSeconds) (int .Values.agentGateway.leaderLeaseDurationSeconds)) }}
{{- fail "agentGateway.leaderRenewIntervalSeconds must be positive and lower than leaderLeaseDurationSeconds" }}
{{- end }}
{{- if not (has .Values.agentGateway.nodeVisibility (list "node_scoped" "unscoped")) }}
{{- fail "agentGateway.nodeVisibility must be node_scoped or unscoped" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.policyStreamMaxConcurrency) 1) (gt (int .Values.agentGateway.policyStreamMaxConcurrency) (int .Values.agentGateway.policyStreamMaxOutstanding)) (gt (int .Values.agentGateway.policyStreamMaxOutstanding) 65536) }}
{{- fail "agentGateway policy stream limits must satisfy 1 <= concurrency <= outstanding <= 65536" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.policyLaneQueueCapacity) 1) (gt (int .Values.agentGateway.policyLaneQueueCapacity) 4096) }}
{{- fail "agentGateway.policyLaneQueueCapacity must be between 1 and 4096" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.maxPolicyStreams) 1) (gt (int .Values.agentGateway.maxPolicyStreams) 4096) }}
{{- fail "agentGateway.maxPolicyStreams must be between 1 and 4096" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.maxReplicationStreams) 1) (gt (int .Values.agentGateway.maxReplicationStreams) 1024) }}
{{- fail "agentGateway.maxReplicationStreams must be between 1 and 1024" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.replicationReconnectBaseDelayMs) 1) (gt (int .Values.agentGateway.replicationReconnectBaseDelayMs) (int .Values.agentGateway.replicationReconnectMaxDelayMs)) (gt (int .Values.agentGateway.replicationReconnectMaxDelayMs) 60000) }}
{{- fail "agentGateway replication reconnect delays must satisfy 1 <= base <= max <= 60000 ms" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.replicationKeepaliveTimeoutSeconds) 1) (gt (int .Values.agentGateway.replicationKeepaliveTimeoutSeconds) (int .Values.agentGateway.replicationKeepaliveIntervalSeconds)) }}
{{- fail "agentGateway replication keepalive must satisfy 1 <= timeout <= interval" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.orchestratorMaxInflightCommands) 1) (gt (int .Values.agentGateway.orchestratorMaxInflightCommands) 65536) }}
{{- fail "agentGateway.orchestratorMaxInflightCommands must be between 1 and 65536" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.circuitFailureThreshold) 1) (gt (int .Values.agentGateway.circuitFailureThreshold) 1000) }}
{{- fail "agentGateway.circuitFailureThreshold must be between 1 and 1000" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.circuitOpenDurationMs) 100) (gt (int .Values.agentGateway.circuitOpenDurationMs) 300000) }}
{{- fail "agentGateway.circuitOpenDurationMs must be between 100 and 300000" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.reconnectBaseDelayMs) 1) (gt (int .Values.agentGateway.reconnectBaseDelayMs) (int .Values.agentGateway.reconnectMaxDelayMs)) (gt (int .Values.agentGateway.reconnectMaxDelayMs) 60000) }}
{{- fail "agentGateway reconnect delays must satisfy 1 <= base <= max <= 60000 ms" }}
{{- end }}
{{- if or (lt (int .Values.agentGateway.keepaliveTimeoutSeconds) 1) (gt (int .Values.agentGateway.keepaliveTimeoutSeconds) (int .Values.agentGateway.keepaliveIntervalSeconds)) }}
{{- fail "agentGateway keepalive must satisfy 1 <= timeout <= interval" }}
{{- end }}
{{- if and .Values.networkPolicy.enabled (eq .Values.networkPolicy.type "standard") (eq (len .Values.agentGateway.kubernetesApiCidrs) 0) }}
{{- fail "agentGateway.kubernetesApiCidrs must contain the Kubernetes API CIDR when standard NetworkPolicy is enabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joysafeter-agent-gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.agentGateway.replicas }}
  # Gateway protocol revisions are intentionally not backward compatible.
  # Recreate prevents an old leader from blocking new replicas that require
  # the new replication stream before they can become ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: joysafeter-agent-gateway
  template:
    metadata:
      labels:
        app: joysafeter-agent-gateway
        app.kubernetes.io/environment: {{ .Values.environment }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/platform/secret.yaml") . | sha256sum }}
        {{- with .Values.agentGateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: joysafeter-agent-gateway
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ add .Values.agentGateway.shutdownGraceSeconds 10 }}
      {{- with .Values.agentGateway.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.agentGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: joysafeter-agent-gateway
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: joysafeter-agent-gateway
      containers:
      - name: agent-gateway
        image: {{ .Values.image.agentGateway }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: xds
          containerPort: {{ .Values.agentGateway.xdsPort }}
        - name: http
          containerPort: {{ .Values.agentGateway.httpPort }}
        - name: mgmt-grpc
          containerPort: {{ .Values.agentGateway.managementGrpcPort }}
        env:
        - name: JOYSAFETER_AGENT_GATEWAY_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: JOYSAFETER_AGENT_GATEWAY_LEADER_ELECTION_ENABLED
          value: "true"
        - name: JOYSAFETER_AGENT_GATEWAY_LEADER_LEASE_NAME
          value: {{ .Values.agentGateway.leaderLeaseName | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_LEADER_LEASE_DURATION_SECS
          value: {{ .Values.agentGateway.leaderLeaseDurationSeconds | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_LEADER_RENEW_INTERVAL_SECS
          value: {{ .Values.agentGateway.leaderRenewIntervalSeconds | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_REPLICATION_ENDPOINT
          value: "http://joysafeter-agent-gateway.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.agentGateway.managementGrpcPort }}"
        - name: JOYSAFETER_AGENT_GATEWAY_REPLICATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.externalSecret }}
              key: JOYSAFETER_AGENT_GATEWAY_REPLICATION_TOKEN
        - name: JOYSAFETER_AGENT_GATEWAY_HOT_STANDBY_MIN_ACKS
          value: {{ .Values.agentGateway.hotStandbyMinAcks | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_REPLICATION_ACK_TIMEOUT_MS
          value: {{ .Values.agentGateway.replicationAckTimeoutMs | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_POLICY_STREAM_MAX_OUTSTANDING
          value: {{ .Values.agentGateway.policyStreamMaxOutstanding | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_POLICY_STREAM_MAX_CONCURRENCY
          value: {{ .Values.agentGateway.policyStreamMaxConcurrency | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_POLICY_LANE_QUEUE_CAPACITY
          value: {{ .Values.agentGateway.policyLaneQueueCapacity | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_MAX_POLICY_STREAMS
          value: {{ .Values.agentGateway.maxPolicyStreams | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_MAX_REPLICATION_STREAMS
          value: {{ .Values.agentGateway.maxReplicationStreams | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_REPLICATION_RECONNECT_BASE_DELAY_MS
          value: {{ .Values.agentGateway.replicationReconnectBaseDelayMs | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_REPLICATION_RECONNECT_MAX_DELAY_MS
          value: {{ .Values.agentGateway.replicationReconnectMaxDelayMs | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_REPLICATION_KEEPALIVE_INTERVAL_SECS
          value: {{ .Values.agentGateway.replicationKeepaliveIntervalSeconds | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_REPLICATION_KEEPALIVE_TIMEOUT_SECS
          value: {{ .Values.agentGateway.replicationKeepaliveTimeoutSeconds | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_XDS_PORT
          value: {{ .Values.agentGateway.xdsPort | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_HTTP_PORT
          value: {{ .Values.agentGateway.httpPort | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_MANAGEMENT_GRPC_PORT
          value: {{ .Values.agentGateway.managementGrpcPort | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_NODE_VISIBILITY
          value: {{ .Values.agentGateway.nodeVisibility | quote }}
        # Keep the boundary process least-privileged: reference only protocol
        # credentials; never inject DB, Redis, vault, or product storage keys.
        - name: JOYSAFETER_XDS_AUTH_KEYRING
          valueFrom:
            secretKeyRef:
              name: {{ .Values.externalSecret }}
              key: JOYSAFETER_XDS_AUTH_KEYRING
        - name: JOYSAFETER_XDS_AUTH_WRITE_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.externalSecret }}
              key: JOYSAFETER_XDS_AUTH_WRITE_KEY_ID
        - name: JOYSAFETER_AGENT_GATEWAY_MANAGEMENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.externalSecret }}
              key: JOYSAFETER_AGENT_GATEWAY_MANAGEMENT_TOKEN
        - name: JOYSAFETER_AGENT_GATEWAY_DELIVERY_TIMEOUT_SECS
          value: {{ .Values.agentGateway.deliveryTimeoutSeconds | quote }}
        # Envoy requires every reference to a named DNS cache to use exactly
        # the same configuration. Keep the Listener-side filter aligned with
        # the bootstrap dynamic_forward_proxy clusters.
        - name: JOYSAFETER_AGENT_GATEWAY_DNS_CACHE_MAX_HOSTS
          value: {{ .Values.envoy.dynamicForwardProxy.maxHosts | quote }}
        - name: JOYSAFETER_AGENT_GATEWAY_SHUTDOWN_GRACE_SECS
          value: {{ .Values.agentGateway.shutdownGraceSeconds | quote }}
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 3
          failureThreshold: 3
          initialDelaySeconds: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          failureThreshold: 3
          initialDelaySeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        resources:
          {{- toYaml .Values.agentGateway.resources | nindent 10 }}
