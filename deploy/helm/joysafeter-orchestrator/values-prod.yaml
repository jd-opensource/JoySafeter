# =============================================================================
# 生产环境 (values-prod.yaml)
# =============================================================================
# 部署前先手工创建两个 Secret (只需一次,一般不变):
#
#   # 1. 私有仓库拉取凭证
#   kubectl create namespace joysafeter-prod
#   kubectl create secret docker-registry aisec-repo-cred -n joysafeter-prod \
#     --docker-server=aisec-repo.jd.com \
#     --docker-username=<账号> --docker-password=<密码>
#
#   # 2. DB/Redis/Vault 凭证
#   kubectl create secret generic joysafeter-secrets-prod -n joysafeter-prod \
#     --from-literal=POSTGRES_HOST=pgm-xxx-prod.pg.rds.jdcloud.com \
#     --from-literal=POSTGRES_PORT=5432 \
#     --from-literal=POSTGRES_USER=joysafeter \
#     --from-literal=POSTGRES_PASSWORD='<密码>' \
#     --from-literal=POSTGRES_DB=joysafeter_prod \
#     --from-literal=REDIS_HOST=redis-xxx-prod.redis.rds.jdcloud.com \
#     --from-literal=REDIS_PORT=6379 \
#     --from-literal=REDIS_PASSWORD='<密码>' \
#     --from-literal=REDIS_DB=0 \
#     --from-literal=JOYSAFETER_XDS_AUTH_KEYRING='{"active-2026-08":"<openssl rand -hex 32>"}' \
#     --from-literal=JOYSAFETER_XDS_AUTH_WRITE_KEY_ID='active-2026-08' \
#     --from-literal=JOYSAFETER_XDS_AUTH_TOKEN='<same token selected by write key id>' \
#     --from-literal=JOYSAFETER_AGENT_GATEWAY_MANAGEMENT_TOKEN='<openssl rand -hex 32>' \
#     --from-literal=JOYSAFETER_AGENT_GATEWAY_REPLICATION_TOKEN='<different openssl rand -hex 32>' \
#     --from-literal=JOYSAFETER_CREDENTIAL_ENCRYPTION_KEYRING='{"active-2026-08":"<key>"}' \
#     --from-literal=JOYSAFETER_CREDENTIAL_ENCRYPTION_WRITE_KEY_ID='active-2026-08' \
#     --from-literal=STORAGE_S3_BUCKET='joysafeter-files-prod' \
#     --from-literal=STORAGE_S3_ENDPOINT='https://<s3-internal-endpoint>' \
#     --from-literal=STORAGE_S3_REGION='<s3 region, optional>' \
#     --from-literal=STORAGE_S3_ACCESS_KEY='<s3 access key>' \
#     --from-literal=STORAGE_S3_SECRET_KEY='<s3 secret key>'
#
# 部署时必须同时传入环境专属 images-prod.lock.yaml。
# =============================================================================

environment: production

# 引用手工创建的 Secret；其中 REDIS_HOST 必须指向 prod 专用 Redis。
externalSecret: joysafeter-secrets-prod

# 引用手工创建的 Secret；其中 REDIS_HOST 必须指向 prod 专用 Redis。
externalSecret: joysafeter-secrets-prod

resourceQuota:
  # Production can use the whole cluster and relies on PriorityClass rather
  # than a namespace ResourceQuota.
  enabled: false
  hard: {}

# ── Orchestrator ──
orchestrator:
  redis:
    keyPrefix: joysafeter:prod

  eventStream:
    key: joysafeter:prod:orchestrator:events

  priorityClassName: joysafeter-production

  sandboxPlacement:
    priorityClassName: joysafeter-production

  # ── 文件存储 ──
  # 线上使用 S3。bucket/endpoint/accessKey/secretKey 可放 externalSecret；
  # 也可以在私有 values 覆盖 orchestrator.storage.s3.bucket/orchestrator.storage.s3.endpoint。
  storage:
    backend: s3
    s3:
      bucket: ""
      endpoint: ""
      region: ""

  resources:
    requests:
      cpu: "2"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "4Gi"

  pool:
    minSize: 5

# ── Agent Identity 信任目标 ──
agentIdentity:
  services:
    - name: jd-wildcard-http
      host: "*.jd.com"
      port: 80
      tls: false
    - name: jd-wildcard-https
      host: "*.jd.com"
      port: 443
      tls: true

# ── 独立 Agent Gateway ──
agentGateway:
  priorityClassName: joysafeter-production

# ── Envoy ──
envoy:
  socketHostDir: /data/joysafeter-prod/envoy-sockets
  priorityClassName: joysafeter-production
  resources:
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "4"
      memory: "2Gi"
