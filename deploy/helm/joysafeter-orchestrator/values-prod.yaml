# =============================================================================
# 生产环境 (values-prod.yaml)
# =============================================================================
# 部署前先手工创建两个 Secret (只需一次,一般不变):
#
#   # 1. 私有仓库拉取凭证
#   kubectl create namespace joysafeter-prod
#   kubectl create secret docker-registry aisec-repo-cred -n joysafeter-prod \
#     --docker-server=aisec-repo.jd.com \
#     --docker-username=<账号> --docker-password=<密码>
#
#   # 2. DB/Redis/Vault 凭证
#   kubectl create secret generic joysafeter-secrets-prod -n joysafeter-prod \
#     --from-literal=POSTGRES_HOST=pgm-xxx-prod.pg.rds.jdcloud.com \
#     --from-literal=POSTGRES_PORT=5432 \
#     --from-literal=POSTGRES_USER=joysafeter \
#     --from-literal=POSTGRES_PASSWORD='<密码>' \
#     --from-literal=POSTGRES_DB=joysafeter_prod \
#     --from-literal=REDIS_HOST=redis-xxx-prod.redis.rds.jdcloud.com \
#     --from-literal=REDIS_PORT=6379 \
#     --from-literal=REDIS_PASSWORD='<密码>' \
#     --from-literal=REDIS_DB=0 \
#     --from-literal=JOYSAFETER_VAULT_ENCRYPTION_KEY='<openssl rand -base64 32>'
#
# 部署: helm install joysafeter-prod . -f values-prod.yaml
# =============================================================================

namespace: joysafeter-prod
environment: production

# 引用手工创建的 Secret (不在此写明文)
externalSecret: joysafeter-secrets-prod

# 私有仓库拉取凭证名 (手工创建的 docker-registry Secret)
image:
  imagePullSecrets:
    - aisec-repo-cred

# ── Orchestrator ──
orchestrator:
  replicas: 3

  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "4"
      memory: "4Gi"

  grpc:
    port: 9090
    maxConnections: 5000
    maxExecutions: 2000

  scheduling:
    maxConcurrentTasks: 500
    maxSchedulingTasks: 300
    batchSize: 10

  sandbox:
    idleTimeout: 300
    stoppedTTL: 3600
    hardTimeout: 21600
    bridgeDisconnectGrace: 90
    failureThreshold: 3

  pool:
    enabled: true
    minSize: 10
    maxAge: 1800

  logLevel: info

# ── Envoy ──
envoy:
  enabled: true
  xdsMode: grpc
  socketHostDir: /data/joysafeter-prod/envoy-sockets
  resources:
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "4"
      memory: "2Gi"

# ── Egress 白名单 ──
egress:
  allowedHosts:
    - ai-api.jdcloud.com