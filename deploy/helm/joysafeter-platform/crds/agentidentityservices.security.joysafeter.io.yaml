apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentidentityservices.security.joysafeter.io
spec:
  group: security.joysafeter.io
  scope: Namespaced
  names:
    plural: agentidentityservices
    singular: agentidentityservice
    kind: AgentIdentityService
    shortNames:
      - aisvc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Host
          type: string
          jsonPath: .spec.host
        - name: Port
          type: integer
          jsonPath: .spec.port
        - name: TLS
          type: boolean
          jsonPath: .spec.tls
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - provider
                - host
                - port
                - tls
              properties:
                provider:
                  type: string
                  enum:
                    - jd
                host:
                  type: string
                  minLength: 3
                  maxLength: 255
                  pattern: '^(\*\.)?([A-Za-z0-9]([-A-Za-z0-9]{0,61}[A-Za-z0-9])?\.)+[A-Za-z0-9]([-A-Za-z0-9]{0,61}[A-Za-z0-9])?\.?$'
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                tls:
                  type: boolean
                enabled:
                  type: boolean
                  default: true
