# =============================================================================
# JoySafeter 云数据库/云 Redis 四服务部署
# =============================================================================
# 用法：
#   cd deploy
#   cp .env.cloud.example .env
#   docker compose -f docker-compose.cloud.yml up -d frontend api orchestrator worker
#
# 服务：
# - frontend：前端 Next.js 服务
# - api：JoySafeter API 服务
# - orchestrator：负责 gRPC、调度和 sandbox 生命周期
# - worker：后台异步任务、reaper、事件落库
#
# 说明：
# - 本文件不启动 PostgreSQL / Redis，必须在 .env 中配置云 PostgreSQL 和云 Redis。
# - orchestrator 如使用 Docker sandbox，会挂载宿主机 Docker socket 创建 sandbox sibling containers。
# =============================================================================

x-backend-build: &backend-build
  context: ../backend
  dockerfile: ../deploy/docker/backend.Dockerfile
  args:
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
    UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
    GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}

x-backend-env-files: &backend-env-files
  - ../backend/.env
  - ../frontend/.env

x-backend-common-env: &backend-common-env
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
  POSTGRES_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_MIN_POOL_SIZE: ${POSTGRES_MIN_POOL_SIZE:-10}
  POSTGRES_MAX_POOL_SIZE: ${POSTGRES_MAX_POOL_SIZE:-100}
  POSTGRES_SSL: ${POSTGRES_SSL:-require}
  DATABASE_ECHO: ${DATABASE_ECHO:-false}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
  REDIS_URL: ${REDIS_URL:?set REDIS_URL}
  REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-50}
  FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
  CORS_ORIGINS: ${CORS_ORIGINS:-["${FRONTEND_URL}"]}
  JOYSAFETER_EVENT_STREAM_ENABLED: ${JOYSAFETER_EVENT_STREAM_ENABLED:-true}
  JOYSAFETER_EVENT_STREAM_KEY: ${JOYSAFETER_EVENT_STREAM_KEY:-joysafeter:orchestrator:events}
  JOYSAFETER_EVENT_STREAM_GROUP: ${JOYSAFETER_EVENT_STREAM_GROUP:-joysafeter-orchestrator-event-workers}
  JOYSAFETER_SANDBOX_PROVIDER: ${JOYSAFETER_SANDBOX_PROVIDER:-docker}
  JOYSAFETER_SANDBOX_IMAGE: ${JOYSAFETER_SANDBOX_IMAGE:-joysafeter-claudecode:latest}
  JOYSAFETER_IMAGE_CLAUDE: ${JOYSAFETER_IMAGE_CLAUDE:-joysafeter-claudecode:latest}
  JOYSAFETER_IMAGE_CODEX: ${JOYSAFETER_IMAGE_CODEX:-joysafeter-codex:latest}

x-backend-volumes: &backend-volumes
  - backend-logs:/app/app/logs
  - backend-files:/app/data/files
  - ../skills:/app/skills:ro

x-backend-health-common: &backend-health-common
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 180s

services:
  api:
    image: ${DOCKER_REGISTRY:-docker.io/jdopensource}/${BACKEND_IMAGE:-joysafeter-backend}:${IMAGE_TAG:-latest}
    build: *backend-build
    container_name: joysafeter-api
    restart: unless-stopped
    env_file: *backend-env-files
    environment:
      <<: *backend-common-env
      JOYSAFETER_SERVICE_ROLE: api
      BACKEND_APP_MODULE: app.joysafeter_api.main:app
      BACKEND_PORT: 8000
      WORKERS: ${API_WORKERS:-1}
    ports:
      - "${API_BIND_HOST:-0.0.0.0}:${API_PORT_HOST:-8000}:8000"
    volumes: *backend-volumes
    healthcheck:
      <<: *backend-health-common
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
    networks:
      - joysafeter-network

  orchestrator:
    image: ${DOCKER_REGISTRY:-docker.io/jdopensource}/${BACKEND_IMAGE:-joysafeter-backend}:${IMAGE_TAG:-latest}
    build: *backend-build
    container_name: joysafeter-orchestrator
    restart: unless-stopped
    env_file: *backend-env-files
    environment:
      <<: *backend-common-env
      JOYSAFETER_SERVICE_ROLE: orchestrator
      BACKEND_APP_MODULE: app.joysafeter_orchestrator.main:app
      BACKEND_PORT: 8001
      ORCHESTRATOR_HTTP_HOST: 0.0.0.0
      WORKERS: 1
      JOYSAFETER_INSTANCE_ID: ${JOYSAFETER_INSTANCE_ID:-orchestrator-001}
      JOYSAFETER_GRPC_HOST: 0.0.0.0
      JOYSAFETER_GRPC_PORT: ${JOYSAFETER_GRPC_PORT:-9090}
      JOYSAFETER_GRPC_PUBLIC_URL: ${JOYSAFETER_GRPC_PUBLIC_URL:-http://host.docker.internal:9090}
    ports:
      # orchestrator HTTP 仅用于健康检查，默认只暴露到宿主机本地。
      - "${ORCHESTRATOR_HEALTH_BIND_HOST:-127.0.0.1}:${ORCHESTRATOR_HEALTH_PORT_HOST:-8001}:8001"
      # gRPC 供 sandbox 容器回连；云上必须用安全组/防火墙限制来源。
      - "${JOYSAFETER_GRPC_BIND_HOST:-0.0.0.0}:${JOYSAFETER_GRPC_PORT_HOST:-9090}:9090"
    volumes:
      - backend-logs:/app/app/logs
      - backend-files:/app/data/files
      - ../skills:/app/skills:ro
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DOCKER_BIN_PATH:-/usr/bin/docker}:/usr/bin/docker:ro
    healthcheck:
      <<: *backend-health-common
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
    networks:
      - joysafeter-network

  worker:
    image: ${DOCKER_REGISTRY:-docker.io/jdopensource}/${BACKEND_IMAGE:-joysafeter-backend}:${IMAGE_TAG:-latest}
    build: *backend-build
    container_name: joysafeter-worker
    restart: unless-stopped
    env_file: *backend-env-files
    environment:
      <<: *backend-common-env
      JOYSAFETER_SERVICE_ROLE: worker
      BACKEND_APP_MODULE: app.joysafeter_worker.main:app
      BACKEND_PORT: 8002
      WORKER_HTTP_HOST: 0.0.0.0
      WORKERS: 1
    ports:
      # worker HTTP 仅用于健康检查，默认只暴露到宿主机本地。
      - "${WORKER_HEALTH_BIND_HOST:-127.0.0.1}:${WORKER_HEALTH_PORT_HOST:-8002}:8002"
    volumes: *backend-volumes
    healthcheck:
      <<: *backend-health-common
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)"]
    networks:
      - joysafeter-network

  frontend:
    image: ${DOCKER_REGISTRY:-docker.io/jdopensource}/${FRONTEND_IMAGE:-joysafeter-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: ../deploy/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${BACKEND_URL:?set BACKEND_URL}
    container_name: joysafeter-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:?set BACKEND_URL}
      NEXT_PUBLIC_APP_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      NEXT_PUBLIC_CSP_NECESSARY_DOMAIN: ${NEXT_PUBLIC_CSP_NECESSARY_DOMAIN:-http://localhost:* http://127.0.0.1:*}
      NEXT_PUBLIC_CSP_CONNECT_SRC_EXTRA: ${NEXT_PUBLIC_CSP_CONNECT_SRC_EXTRA:-}
      NEXT_PUBLIC_CSP_FRAME_SRC_EXTRA: ${NEXT_PUBLIC_CSP_FRAME_SRC_EXTRA:-}
    ports:
      - "${FRONTEND_BIND_HOST:-0.0.0.0}:${FRONTEND_PORT_HOST:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - joysafeter-network

volumes:
  backend-logs:
    driver: local
  backend-files:
    driver: local
    name: joysafeter-backend-files

networks:
  joysafeter-network:
    name: joysafeter-network
    driver: bridge
