# =============================================================================
# JoySafeter 三服务容器化覆盖配置
# =============================================================================
# 用法：
#   cd deploy
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up -d db redis backend runner worker frontend
#
# 说明：
# - backend 服务在本覆盖文件中作为 API 服务运行，容器名为 joysafeter-api。
# - runner 是 Python orchestrator/runner 服务，负责 gRPC、调度和创建 sandbox 容器。
# - worker 是后台异步任务/事件落库服务，不需要 Docker socket。
# - runner 在容器内创建宿主机 sandbox 容器时采用 Docker-outside-of-Docker：挂载宿主机 /var/run/docker.sock。
#   这不是 Docker-in-Docker，但安全权限很高，生产环境必须仅部署在可信内网机器上。
# =============================================================================

x-backend-build: &backend-build
  context: ../backend
  dockerfile: ../deploy/docker/backend.Dockerfile
  args:
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
    UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
    GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}

x-backend-env-files: &backend-env-files
  - ../backend/.env
  - ../frontend/.env

x-backend-common-env: &backend-common-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-joysafeter}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_MIN_POOL_SIZE: ${POSTGRES_MIN_POOL_SIZE:-10}
  POSTGRES_MAX_POOL_SIZE: ${POSTGRES_MAX_POOL_SIZE:-500}
  POSTGRES_SSL: ${POSTGRES_SSL:-disable}
  DATABASE_ECHO: ${DATABASE_ECHO:-false}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-50}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-["${FRONTEND_URL:-http://localhost:3000}"]}
  JOYSAFETER_EVENT_STREAM_ENABLED: ${JOYSAFETER_EVENT_STREAM_ENABLED:-true}
  JOYSAFETER_EVENT_STREAM_KEY: ${JOYSAFETER_EVENT_STREAM_KEY:-joysafeter:orchestrator:events}
  JOYSAFETER_EVENT_STREAM_GROUP: ${JOYSAFETER_EVENT_STREAM_GROUP:-joysafeter-orchestrator-event-workers}

x-backend-volumes: &backend-volumes
  - backend-logs:/app/app/logs
  - backend-files:/app/data/files
  - ../skills:/app/skills:ro

x-backend-depends: &backend-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

x-backend-health-common: &backend-health-common
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 180s

services:
  # API：HTTP / WebSocket / 管理接口
  backend:
    image: ${DOCKER_REGISTRY:-docker.io/jdopensource}/${BACKEND_IMAGE:-joysafeter-backend}:${IMAGE_TAG:-latest}
    build: *backend-build
    container_name: joysafeter-api
    restart: unless-stopped
    env_file: *backend-env-files
    environment:
      <<: *backend-common-env
      JOYSAFETER_SERVICE_ROLE: api
      BACKEND_APP_MODULE: app.joysafeter_api.main:app
      BACKEND_PORT: 8000
      WORKERS: ${API_WORKERS:-1}
    ports:
      - "${BACKEND_BIND_HOST:-0.0.0.0}:${BACKEND_PORT_HOST:-8000}:8000"
    depends_on: *backend-depends
    volumes: *backend-volumes
    healthcheck:
      <<: *backend-health-common
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
    networks:
      - joysafeter-network

  # Runner：Python orchestrator / gRPC gateway / sandbox lifecycle
  runner:
    image: ${DOCKER_REGISTRY:-docker.io/jdopensource}/${BACKEND_IMAGE:-joysafeter-backend}:${IMAGE_TAG:-latest}
    build: *backend-build
    container_name: joysafeter-runner
    restart: unless-stopped
    env_file: *backend-env-files
    environment:
      <<: *backend-common-env
      JOYSAFETER_SERVICE_ROLE: runner
      BACKEND_APP_MODULE: app.joysafeter_orchestrator.main:app
      BACKEND_PORT: 8001
      RUNNER_HTTP_HOST: 0.0.0.0
      WORKERS: 1
      JOYSAFETER_INSTANCE_ID: ${JOYSAFETER_INSTANCE_ID:-runner-001}
      JOYSAFETER_GRPC_HOST: 0.0.0.0
      JOYSAFETER_GRPC_PORT: ${JOYSAFETER_GRPC_PORT:-9090}
      JOYSAFETER_GRPC_PUBLIC_URL: ${JOYSAFETER_GRPC_PUBLIC_URL:-http://host.docker.internal:9090}
    ports:
      # HTTP 健康检查端口默认只绑定宿主机本地，避免公网访问 runner HTTP。
      - "${RUNNER_HEALTH_BIND_HOST:-127.0.0.1}:${RUNNER_HEALTH_PORT_HOST:-8001}:8001"
      # gRPC 端口供 sandbox 容器访问；云上建议用安全组/防火墙限制，默认不应向公网开放。
      - "${JOYSAFETER_GRPC_BIND_HOST:-0.0.0.0}:${JOYSAFETER_GRPC_PORT_HOST:-9090}:9090"
    depends_on: *backend-depends
    volumes:
      - backend-logs:/app/app/logs
      - backend-files:/app/data/files
      - ../skills:/app/skills:ro
      # Docker-outside-of-Docker：runner 通过宿主机 Docker daemon 创建 sandbox sibling containers。
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # 代码中仍有 docker CLI 调用（docker run/exec/cp/inspect），因此容器内需要 docker 客户端。
      - ${DOCKER_BIN_PATH:-/usr/bin/docker}:/usr/bin/docker:ro
    healthcheck:
      <<: *backend-health-common
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
    networks:
      - joysafeter-network

  # Worker：后台任务、reaper、Redis Stream 批量落库
  worker:
    image: ${DOCKER_REGISTRY:-docker.io/jdopensource}/${BACKEND_IMAGE:-joysafeter-backend}:${IMAGE_TAG:-latest}
    build: *backend-build
    container_name: joysafeter-worker
    restart: unless-stopped
    env_file: *backend-env-files
    environment:
      <<: *backend-common-env
      JOYSAFETER_SERVICE_ROLE: worker
      BACKEND_APP_MODULE: app.joysafeter_worker.main:app
      BACKEND_PORT: 8002
      WORKER_HTTP_HOST: 0.0.0.0
      WORKERS: 1
    ports:
      # Worker HTTP 仅用于健康检查，默认只绑定宿主机本地。
      - "${WORKER_HEALTH_BIND_HOST:-127.0.0.1}:${WORKER_HEALTH_PORT_HOST:-8002}:8002"
    depends_on: *backend-depends
    volumes: *backend-volumes
    healthcheck:
      <<: *backend-health-common
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)"]
    networks:
      - joysafeter-network

  frontend:
    depends_on:
      backend:
        condition: service_healthy

  # 三服务容器化部署时，mcpserver 默认占用宿主机 8001/8002，
  # 会与 runner/worker 健康检查端口冲突；需要时显式加 --profile mcp 启动。
  mcpserver:
    profiles:
      - mcp
