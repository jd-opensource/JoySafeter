# Optional overlay to run the cron-scheduler control plane as multiple worker
# replicas. The scheduler is multi-instance-safe (Postgres FOR UPDATE SKIP
# LOCKED claim + stale-lock reclaim + hostname-derived worker_id; the
# event-stream consumer uses a Redis consumer group). See deploy/HA.md.
#
# Usage (both equivalent):
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml --profile local-redis --profile sandbox up -d
#   # or, without this file:
#   docker compose --profile local-redis --profile sandbox up -d --scale worker=3
#
# NOTE: this overlay only scales the WORKER (control plane / scheduler + event
# consumer). Scaling orchestrator-rs (the task DATA plane) additionally requires
# each replica to expose a distinct, sandbox-reachable gRPC address
# (JOYSAFETER_GRPC_PUBLIC_URL) — see the "Scaling the orchestrator" section of
# deploy/HA.md. The task data plane is already correctness-safe under multiple
# instances (owner_epoch fencing + leases + watchdog reclaim); only the network
# addressing is unsolved here.

services:
  worker:
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
