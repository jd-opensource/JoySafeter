name: Docker Build CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  # =============================================================================
  # Detect which image inputs changed and build only those images.
  # =============================================================================
  check-image-changes:
    name: Check Sandbox File Changes
    runs-on: ubuntu-latest
    outputs:
      main_matrix: ${{ steps.main-matrix.outputs.matrix }}
      has_main_images: ${{ steps.main-matrix.outputs.has_images }}
      sandbox_changed: ${{ steps.main-matrix.outputs.sandbox_changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check image-specific file changes
        uses: dorny/paths-filter@v3
        id: image-filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'deploy/docker/frontend.Dockerfile'
            orchestrator:
              - 'backend/app/joysafeter_orchestrator_rs/**'
              - 'proto/**'
              - '.dockerignore'
              - 'deploy/docker/orchestrator-rs.Dockerfile'
            backend_build:
              - 'deploy/docker/backend.Dockerfile'
            sandbox:
              - 'deploy/docker/sandbox.Dockerfile'
              - 'deploy/docker/configs/**'
              - 'deploy/docker/entrypoint.sh'
            workflow:
              - '.github/workflows/docker-build.yml'

      - name: Check backend runtime file changes
        uses: dorny/paths-filter@v3
        id: backend-filter
        with:
          predicate-quantifier: every
          filters: |
            backend:
              - 'backend/**'
              - '!backend/app/joysafeter_orchestrator_rs/**'
              - '!backend/tests/**'
              - '!backend/unit_tests/**'
              - '!backend/data/**'
              - '!backend/joysafeter_skillspector/**'
              - '!backend/tools/**'

      - name: Generate main image matrix
        id: main-matrix
        env:
          BACKEND_CHANGED: ${{ steps.backend-filter.outputs.backend }}
          BACKEND_BUILD_CHANGED: ${{ steps.image-filter.outputs.backend_build }}
          FRONTEND_CHANGED: ${{ steps.image-filter.outputs.frontend }}
          ORCHESTRATOR_CHANGED: ${{ steps.image-filter.outputs.orchestrator }}
          SANDBOX_CHANGED: ${{ steps.image-filter.outputs.sandbox }}
          WORKFLOW_CHANGED: ${{ steps.image-filter.outputs.workflow }}
        run: |
          images=()

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$WORKFLOW_CHANGED" == "true" ]]; then
            BACKEND_CHANGED=true
            FRONTEND_CHANGED=true
            ORCHESTRATOR_CHANGED=true
            SANDBOX_CHANGED=true
          fi

          if [[ "$BACKEND_CHANGED" == "true" || "$BACKEND_BUILD_CHANGED" == "true" ]]; then
            images+=('{"name":"joysafeter-backend","context":"./backend","dockerfile":"./deploy/docker/backend.Dockerfile"}')
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            images+=('{"name":"joysafeter-frontend","context":"./frontend","dockerfile":"./deploy/docker/frontend.Dockerfile"}')
          fi
          if [[ "$ORCHESTRATOR_CHANGED" == "true" ]]; then
            images+=('{"name":"joysafeter-orchestrator-rs","context":".","dockerfile":"./deploy/docker/orchestrator-rs.Dockerfile"}')
          fi

          joined="$(IFS=,; echo "${images[*]}")"
          echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
          if (( ${#images[@]} > 0 )); then
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sandbox_changed=$SANDBOX_CHANGED" >> "$GITHUB_OUTPUT"

  # =============================================================================
  # Main application images. Build only (no push); release.yml publishes images.
  # =============================================================================
  build:
    name: Build Docker Images (${{ matrix.name }}, ${{ matrix.context }}, ${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    needs: check-image-changes
    if: needs.check-image-changes.outputs.has_main_images == 'true'

    strategy:
      matrix: ${{ fromJSON(needs.check-image-changes.outputs.main_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            PIP_INDEX_URL=https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
            UV_INDEX_URL=https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
            CARGO_REGISTRY_MIRROR=sparse+https://rsproxy.cn/index/

  # =============================================================================
  # Sandbox image (independent, only triggered when sandbox files change)
  # Build only (no push) — release.yml handles publishing versioned images
  # =============================================================================
  build-sandbox:
    name: Build Sandbox Image
    runs-on: ubuntu-latest
    needs: check-image-changes
    if: needs.check-image-changes.outputs.sandbox_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Sandbox image
        uses: docker/build-push-action@v5
        with:
          context: ./deploy/docker
          file: ./deploy/docker/sandbox.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
