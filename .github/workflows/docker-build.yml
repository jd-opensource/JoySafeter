name: Docker Build CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-matrix:
    name: Load image component registry
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.registry.outputs.container }}
      orchestrator: ${{ steps.registry.outputs.orchestrator }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Export build matrices
        id: registry
        shell: bash
        run: |
          echo "container=$(./deploy/deploy.sh registry --family container --format github)" >> "$GITHUB_OUTPUT"
          echo "orchestrator=$(./deploy/deploy.sh registry --family orchestrator --format github)" >> "$GITHUB_OUTPUT"

  # Build architecture-specific orchestrator binaries once. Agent runtimes own
  # their runner compilation inside deploy/docker/runtime.Dockerfile.
  rust-binaries:
    name: Build orchestrator binaries (zigbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install orchestrator cross-compile tools
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
          cargo install cargo-zigbuild --locked
          pip install ziglang
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Build orchestrator (amd64 + arm64, jd-identity)
        working-directory: backend/app/joysafeter_orchestrator_rs
        run: |
          set -euo pipefail
          PROTOC="$(command -v protoc)" cargo zigbuild --release -p joysafeter-orchestrator \
            --features jd-identity \
            --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu

      - name: Stage orchestrator binaries into repo-root target/ tree
        run: |
          set -euo pipefail
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mkdir -p "target/${triple}/release"
            cp "backend/app/joysafeter_orchestrator_rs/target/${triple}/release/joysafeter-orchestrator" "target/${triple}/release/"
          done

      - name: Upload Rust binaries
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries
          path: |
            target/x86_64-unknown-linux-gnu/release/joysafeter-orchestrator
            target/aarch64-unknown-linux-gnu/release/joysafeter-orchestrator
          if-no-files-found: error

  # The orchestrator image packages the prebuilt architecture-specific binary.
  build-rust:
    name: Build ${{ matrix.image.name }} (${{ matrix.arch }})
    needs:
      - image-matrix
      - rust-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ${{ fromJSON(needs.image-matrix.outputs.orchestrator).include }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Rust binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: target

      - name: Restore binary permissions
        run: chmod +x target/*/release/joysafeter-* || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ format(matrix.image.dockerfile, matrix.arch) }}
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}

  # Images built entirely inside Docker, including all agent runtimes.
  build-nonrust:
    name: Build ${{ matrix.image.name }}
    needs: image-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.image-matrix.outputs.container).include }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout SkillSpector
        if: matrix.image.skillspector
        uses: actions/checkout@v6
        with:
          repository: NVIDIA/SkillSpector
          ref: v2.5.1
          path: .deps/SkillSpector

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          build-contexts: ${{ matrix.image.build_contexts }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
            UV_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
