name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml

  prepare-release:
    name: Validate Release Metadata
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.changelog.outputs.body }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate tag and package versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          backend_version="$(awk -F'"' '/^version = / { print $2; exit }' backend/pyproject.toml)"
          frontend_version="$(node -p "require('./frontend/package.json').version")"

          if [[ "$tag" != "v$version" || -z "$version" ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if [[ "$backend_version" != "$version" || "$frontend_version" != "$version" ]]; then
            echo "Version mismatch: tag=$version backend=$backend_version frontend=$frontend_version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          body="$(awk -v heading="## ${tag}" '
            index($0, heading) == 1 { found=1; next }
            found && /^## / { exit }
            found && /^---$/ { exit }
            found { print }
          ' CHANGELOG.md)"

          if [[ -z "${body//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md is missing a non-empty '${tag}' section" >&2
            exit 1
          fi

          {
            echo 'body<<CHANGELOG_EOF'
            echo "$body"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  image-matrix:
    name: Load image component registry
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.registry.outputs.container }}
      orchestrator: ${{ steps.registry.outputs.orchestrator }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Export build matrices
        id: registry
        shell: bash
        run: |
          echo "container=$(./deploy/deploy.sh registry --family container --format github)" >> "$GITHUB_OUTPUT"
          echo "orchestrator=$(./deploy/deploy.sh registry --family orchestrator --format github)" >> "$GITHUB_OUTPUT"

  # Build architecture-specific orchestrator binaries once. Agent runtimes own
  # their runner compilation inside deploy/docker/runtime.Dockerfile.
  rust-binaries:
    name: Build orchestrator binaries (zigbuild)
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install orchestrator cross-compile tools
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
          cargo install cargo-zigbuild --locked
          pip install ziglang
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Build orchestrator (amd64 + arm64, jd-identity)
        working-directory: backend/app/joysafeter_orchestrator_rs
        run: |
          set -euo pipefail
          PROTOC="$(command -v protoc)" cargo zigbuild --release -p joysafeter-orchestrator \
            --features jd-identity \
            --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu

      - name: Stage orchestrator binaries into repo-root target/ tree
        run: |
          set -euo pipefail
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mkdir -p "target/${triple}/release"
            cp "backend/app/joysafeter_orchestrator_rs/target/${triple}/release/joysafeter-orchestrator" "target/${triple}/release/"
          done

      - name: Upload Rust binaries
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries
          path: |
            target/x86_64-unknown-linux-gnu/release/joysafeter-orchestrator
            target/aarch64-unknown-linux-gnu/release/joysafeter-orchestrator
          if-no-files-found: error

  # Non-Rust images: single multi-arch buildx build + push, then sign/attest.
  build-and-push:
    name: Publish ${{ matrix.image.name }}
    needs:
      - prepare-release
      - image-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.image-matrix.outputs.container).include }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout SkillSpector
        if: matrix.image.skillspector
        uses: actions/checkout@v6
        with:
          repository: NVIDIA/SkillSpector
          ref: v2.5.1
          path: .deps/SkillSpector

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          version="${{ needs.prepare-release.outputs.version }}"
          tag="${{ needs.prepare-release.outputs.tag }}"
          image="${{ matrix.image.name }}"
          candidate="sha-${GITHUB_SHA}"
          echo "docker_repository=docker.io/jdopensource/${image}" >> "$GITHUB_OUTPUT"
          echo "ghcr_repository=ghcr.io/jd-opensource/${image}" >> "$GITHUB_OUTPUT"
          echo "docker_candidate=docker.io/jdopensource/${image}:${candidate}" >> "$GITHUB_OUTPUT"
          echo "ghcr_candidate=ghcr.io/jd-opensource/${image}:${candidate}" >> "$GITHUB_OUTPUT"
          echo "candidate_tags=docker.io/jdopensource/${image}:${candidate},ghcr.io/jd-opensource/${image}:${candidate}" >> "$GITHUB_OUTPUT"
          echo "release_tags=${tag} ${version} latest" >> "$GITHUB_OUTPUT"

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          build-contexts: ${{ matrix.image.build_contexts }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.candidate_tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
            UV_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.ghcr_candidate }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Attest Docker Hub provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.tags.outputs.docker_repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest GHCR provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.tags.outputs.ghcr_repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign candidate digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKER_REPOSITORY: ${{ steps.tags.outputs.docker_repository }}
          GHCR_REPOSITORY: ${{ steps.tags.outputs.ghcr_repository }}
        run: |
          set -euo pipefail
          cosign sign --yes "${DOCKER_REPOSITORY}@${DIGEST}"
          cosign sign --yes "${GHCR_REPOSITORY}@${DIGEST}"

      - name: Promote verified release tags
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKER_CANDIDATE: ${{ steps.tags.outputs.docker_candidate }}
          DOCKER_REPOSITORY: ${{ steps.tags.outputs.docker_repository }}
          GHCR_CANDIDATE: ${{ steps.tags.outputs.ghcr_candidate }}
          GHCR_REPOSITORY: ${{ steps.tags.outputs.ghcr_repository }}
          RELEASE_TAGS: ${{ steps.tags.outputs.release_tags }}
        run: |
          set -euo pipefail
          docker_args=()
          ghcr_args=()
          for tag in ${RELEASE_TAGS}; do
            docker_args+=(--tag "${DOCKER_REPOSITORY}:${tag}")
            ghcr_args+=(--tag "${GHCR_REPOSITORY}:${tag}")
          done
          docker buildx imagetools create "${docker_args[@]}" "${DOCKER_CANDIDATE}@${DIGEST}"
          docker buildx imagetools create "${ghcr_args[@]}" "${GHCR_CANDIDATE}@${DIGEST}"

  # The orchestrator packages prebuilt architecture-specific binaries, pushes
  # per-architecture digests, then merges them into one signed manifest.
  build-and-push-rust:
    name: Publish ${{ matrix.image.name }}
    needs:
      - prepare-release
      - image-matrix
      - rust-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.image-matrix.outputs.orchestrator).include }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Rust binaries
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: target

      - name: Restore binary permissions
        run: chmod +x target/*/release/joysafeter-* || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          version="${{ needs.prepare-release.outputs.version }}"
          tag="${{ needs.prepare-release.outputs.tag }}"
          image="${{ matrix.image.name }}"
          candidate="sha-${GITHUB_SHA}"
          echo "docker_repository=docker.io/jdopensource/${image}" >> "$GITHUB_OUTPUT"
          echo "ghcr_repository=ghcr.io/jd-opensource/${image}" >> "$GITHUB_OUTPUT"
          echo "docker_candidate=docker.io/jdopensource/${image}:${candidate}" >> "$GITHUB_OUTPUT"
          echo "ghcr_candidate=ghcr.io/jd-opensource/${image}:${candidate}" >> "$GITHUB_OUTPUT"
          echo "release_tags=${tag} ${version} latest" >> "$GITHUB_OUTPUT"

      - name: Build & push per-arch images by digest
        id: build
        shell: bash
        env:
          GHCR_REPOSITORY: ${{ steps.tags.outputs.ghcr_repository }}
          DOCKER_REPOSITORY: ${{ steps.tags.outputs.docker_repository }}
          DOCKERFILE_PATTERN: ${{ matrix.image.dockerfile }}
        run: |
          set -euo pipefail
          declare -A DIGESTS
          for arch in amd64 arm64; do
            dockerfile="${DOCKERFILE_PATTERN/\{0\}/${arch}}"
            # push-by-digest to BOTH registries; --tag-less so only digests are created.
            metadata="$(docker buildx build \
              --file "$dockerfile" \
              --platform "linux/${arch}" \
              --provenance=mode=max --sbom=true \
              --cache-from type=gha --cache-to type=gha,mode=max \
              --build-arg "GIT_COMMIT_SHA=${GITHUB_SHA}" \
              --output "type=image,name=${GHCR_REPOSITORY},push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file /dev/stdout \
              . )"
            digest="$(echo "$metadata" | jq -r '."containerimage.digest"')"
            [ -n "$digest" ] && [ "$digest" != "null" ] || { echo "no digest for $arch" >&2; exit 1; }
            DIGESTS[$arch]="$digest"
            echo "${arch} -> ${digest}"
          done
          echo "amd64_digest=${DIGESTS[amd64]}" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=${DIGESTS[arm64]}" >> "$GITHUB_OUTPUT"

      - name: Merge per-arch digests into candidate manifest
        id: merge
        shell: bash
        env:
          GHCR_REPOSITORY: ${{ steps.tags.outputs.ghcr_repository }}
          GHCR_CANDIDATE: ${{ steps.tags.outputs.ghcr_candidate }}
          AMD64_DIGEST: ${{ steps.build.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.build.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${GHCR_CANDIDATE}" \
            "${GHCR_REPOSITORY}@${AMD64_DIGEST}" \
            "${GHCR_REPOSITORY}@${ARM64_DIGEST}"
          merged="$(docker buildx imagetools inspect "${GHCR_CANDIDATE}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ -n "$merged" ] || { echo "could not resolve merged digest" >&2; exit 1; }
          echo "digest=${merged}" >> "$GITHUB_OUTPUT"
          echo "merged manifest digest: ${merged}"

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.ghcr_candidate }}@${{ steps.merge.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Mirror candidate to Docker Hub
        shell: bash
        env:
          GHCR_CANDIDATE: ${{ steps.tags.outputs.ghcr_candidate }}
          DOCKER_CANDIDATE: ${{ steps.tags.outputs.docker_candidate }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${DOCKER_CANDIDATE}" "${GHCR_CANDIDATE}"

      - name: Resolve Docker Hub candidate digest
        id: dockerhub
        shell: bash
        env:
          DOCKER_CANDIDATE: ${{ steps.tags.outputs.docker_candidate }}
        run: |
          set -euo pipefail
          d="$(docker buildx imagetools inspect "${DOCKER_CANDIDATE}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ -n "$d" ] || { echo "could not resolve docker hub digest" >&2; exit 1; }
          echo "digest=${d}" >> "$GITHUB_OUTPUT"

      - name: Attest Docker Hub provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.tags.outputs.docker_repository }}
          subject-digest: ${{ steps.dockerhub.outputs.digest }}
          push-to-registry: true

      - name: Attest GHCR provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.tags.outputs.ghcr_repository }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign candidate digests
        shell: bash
        env:
          GHCR_DIGEST: ${{ steps.merge.outputs.digest }}
          DOCKER_DIGEST: ${{ steps.dockerhub.outputs.digest }}
          DOCKER_REPOSITORY: ${{ steps.tags.outputs.docker_repository }}
          GHCR_REPOSITORY: ${{ steps.tags.outputs.ghcr_repository }}
        run: |
          set -euo pipefail
          cosign sign --yes "${DOCKER_REPOSITORY}@${DOCKER_DIGEST}"
          cosign sign --yes "${GHCR_REPOSITORY}@${GHCR_DIGEST}"

      - name: Promote verified release tags
        shell: bash
        env:
          GHCR_DIGEST: ${{ steps.merge.outputs.digest }}
          DOCKER_CANDIDATE: ${{ steps.tags.outputs.docker_candidate }}
          DOCKER_REPOSITORY: ${{ steps.tags.outputs.docker_repository }}
          GHCR_CANDIDATE: ${{ steps.tags.outputs.ghcr_candidate }}
          GHCR_REPOSITORY: ${{ steps.tags.outputs.ghcr_repository }}
          RELEASE_TAGS: ${{ steps.tags.outputs.release_tags }}
        run: |
          set -euo pipefail
          docker_args=()
          ghcr_args=()
          for tag in ${RELEASE_TAGS}; do
            docker_args+=(--tag "${DOCKER_REPOSITORY}:${tag}")
            ghcr_args+=(--tag "${GHCR_REPOSITORY}:${tag}")
          done
          docker buildx imagetools create "${ghcr_args[@]}" "${GHCR_CANDIDATE}"
          docker buildx imagetools create "${docker_args[@]}" "${DOCKER_CANDIDATE}"

  create-release:
    name: Create GitHub Release
    needs:
      - prepare-release
      - build-and-push
      - build-and-push-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Release ${{ needs.prepare-release.outputs.tag }}
          body: |
            ## What's Changed

            ${{ needs.prepare-release.outputs.body }}
          draft: false
          prerelease: false
