name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml

  prepare-release:
    name: Validate Release Metadata
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.changelog.outputs.body }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate tag and package versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          backend_version="$(awk -F'"' '/^version = / { print $2; exit }' backend/pyproject.toml)"
          frontend_version="$(node -p "require('./frontend/package.json').version")"

          if [[ "$tag" != "v$version" || -z "$version" ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if [[ "$backend_version" != "$version" || "$frontend_version" != "$version" ]]; then
            echo "Version mismatch: tag=$version backend=$backend_version frontend=$frontend_version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          body="$(awk -v heading="## ${tag}" '
            index($0, heading) == 1 { found=1; next }
            found && /^## / { exit }
            found && /^---$/ { exit }
            found { print }
          ' CHANGELOG.md)"

          if [[ -z "${body//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md is missing a non-empty '${tag}' section" >&2
            exit 1
          fi

          {
            echo 'body<<CHANGELOG_EOF'
            echo "$body"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Publish ${{ matrix.image.name }}
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: joysafeter-backend
            context: ./backend
            dockerfile: ./deploy/docker/backend.Dockerfile
            skillspector: false
            build_contexts: ''
          - name: joysafeter-frontend
            context: ./frontend
            dockerfile: ./deploy/docker/frontend.Dockerfile
            skillspector: false
            build_contexts: ''
          - name: joysafeter-orchestrator-rs
            context: .
            dockerfile: ./deploy/docker/orchestrator-rs.Dockerfile
            skillspector: false
            build_contexts: ''
          - name: joysafeter-skillspector
            context: ./backend/joysafeter_skillspector
            dockerfile: ./deploy/docker/skillspector-service.Dockerfile
            skillspector: true
            build_contexts: skillspector=./.deps/SkillSpector
          - name: joysafeter-claudecode
            context: .
            dockerfile: ./deploy/docker/claudecode.Dockerfile
            skillspector: false
            build_contexts: ''
          - name: joysafeter-codex
            context: .
            dockerfile: ./deploy/docker/codex.Dockerfile
            skillspector: false
            build_contexts: ''
          - name: joysafeter-pi
            context: .
            dockerfile: ./deploy/docker/pi.Dockerfile
            skillspector: false
            build_contexts: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout SkillSpector
        if: matrix.image.skillspector
        uses: actions/checkout@v6
        with:
          repository: NVIDIA/SkillSpector
          ref: v2.5.1
          path: .deps/SkillSpector

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          version="${{ needs.prepare-release.outputs.version }}"
          tag="${{ needs.prepare-release.outputs.tag }}"
          image="${{ matrix.image.name }}"
          candidate="sha-${GITHUB_SHA}"
          echo "docker_repository=docker.io/jdopensource/${image}" >> "$GITHUB_OUTPUT"
          echo "ghcr_repository=ghcr.io/jd-opensource/${image}" >> "$GITHUB_OUTPUT"
          echo "docker_candidate=docker.io/jdopensource/${image}:${candidate}" >> "$GITHUB_OUTPUT"
          echo "ghcr_candidate=ghcr.io/jd-opensource/${image}:${candidate}" >> "$GITHUB_OUTPUT"
          echo "candidate_tags=docker.io/jdopensource/${image}:${candidate},ghcr.io/jd-opensource/${image}:${candidate}" >> "$GITHUB_OUTPUT"
          echo "release_tags=${tag} ${version} latest" >> "$GITHUB_OUTPUT"

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          build-contexts: ${{ matrix.image.build_contexts }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.candidate_tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
            UV_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.ghcr_candidate }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Attest Docker Hub provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.tags.outputs.docker_repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest GHCR provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.tags.outputs.ghcr_repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign candidate digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKER_REPOSITORY: ${{ steps.tags.outputs.docker_repository }}
          GHCR_REPOSITORY: ${{ steps.tags.outputs.ghcr_repository }}
        run: |
          set -euo pipefail
          cosign sign --yes "${DOCKER_REPOSITORY}@${DIGEST}"
          cosign sign --yes "${GHCR_REPOSITORY}@${DIGEST}"

      - name: Promote verified release tags
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKER_CANDIDATE: ${{ steps.tags.outputs.docker_candidate }}
          DOCKER_REPOSITORY: ${{ steps.tags.outputs.docker_repository }}
          GHCR_CANDIDATE: ${{ steps.tags.outputs.ghcr_candidate }}
          GHCR_REPOSITORY: ${{ steps.tags.outputs.ghcr_repository }}
          RELEASE_TAGS: ${{ steps.tags.outputs.release_tags }}
        run: |
          set -euo pipefail
          docker_args=()
          ghcr_args=()
          for tag in ${RELEASE_TAGS}; do
            docker_args+=(--tag "${DOCKER_REPOSITORY}:${tag}")
            ghcr_args+=(--tag "${GHCR_REPOSITORY}:${tag}")
          done
          docker buildx imagetools create "${docker_args[@]}" "${DOCKER_CANDIDATE}@${DIGEST}"
          docker buildx imagetools create "${ghcr_args[@]}" "${GHCR_CANDIDATE}@${DIGEST}"

  create-release:
    name: Create GitHub Release
    needs:
      - prepare-release
      - build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Release ${{ needs.prepare-release.outputs.tag }}
          body: |
            ## What's Changed

            ${{ needs.prepare-release.outputs.body }}
          draft: false
          prerelease: false
