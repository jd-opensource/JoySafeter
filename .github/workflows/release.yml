name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml

  prepare-release:
    name: Validate Release Metadata
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.changelog.outputs.body }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag and package versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          backend_version="$(awk -F'"' '/^version = / { print $2; exit }' backend/pyproject.toml)"
          frontend_version="$(node -p "require('./frontend/package.json').version")"

          if [[ "$tag" != "v$version" || -z "$version" ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if [[ "$backend_version" != "$version" || "$frontend_version" != "$version" ]]; then
            echo "Version mismatch: tag=$version backend=$backend_version frontend=$frontend_version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          body="$(awk -v heading="## ${tag}" '
            index($0, heading) == 1 { found=1; next }
            found && /^## / { exit }
            found && /^---$/ { exit }
            found { print }
          ' CHANGELOG.md)"

          if [[ -z "${body//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md is missing a non-empty '${tag}' section" >&2
            exit 1
          fi

          {
            echo 'body<<CHANGELOG_EOF'
            echo "$body"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Publish ${{ matrix.image.name }}
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: joysafeter-backend
            context: ./backend
            dockerfile: ./deploy/docker/backend.Dockerfile
            skillspector: false
            build_contexts: ''
          - name: joysafeter-frontend
            context: ./frontend
            dockerfile: ./deploy/docker/frontend.Dockerfile
            skillspector: false
            build_contexts: ''
          - name: joysafeter-orchestrator-rs
            context: .
            dockerfile: ./deploy/docker/orchestrator-rs.Dockerfile
            skillspector: false
            build_contexts: ''
          - name: joysafeter-skillspector
            context: ./backend/joysafeter_skillspector
            dockerfile: ./deploy/docker/skillspector-service.Dockerfile
            skillspector: true
            build_contexts: skillspector=./.deps/SkillSpector
          - name: joysafeter-claudecode
            context: .
            dockerfile: ./deploy/docker/claudecode.Dockerfile
            skillspector: false
            build_contexts: ''
          - name: joysafeter-codex
            context: .
            dockerfile: ./deploy/docker/codex.Dockerfile
            skillspector: false
            build_contexts: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout SkillSpector
        if: matrix.image.skillspector
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/SkillSpector
          ref: v2.5.1
          path: .deps/SkillSpector

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          version="${{ needs.prepare-release.outputs.version }}"
          tag="${{ needs.prepare-release.outputs.tag }}"
          image="${{ matrix.image.name }}"
          echo "tags=docker.io/jdopensource/${image}:${tag},docker.io/jdopensource/${image}:${version},docker.io/jdopensource/${image}:latest,ghcr.io/jd-opensource/${image}:${tag},ghcr.io/jd-opensource/${image}:${version},ghcr.io/jd-opensource/${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          build-contexts: ${{ matrix.image.build_contexts }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            PIP_INDEX_URL=https://mirrors.tuna.tsinghua.edu.cn/pypi/simple
            UV_INDEX_URL=https://mirrors.tuna.tsinghua.edu.cn/pypi/simple

  create-release:
    name: Create GitHub Release
    needs:
      - prepare-release
      - build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Release ${{ needs.prepare-release.outputs.tag }}
          body: |
            ## What's Changed

            ${{ needs.prepare-release.outputs.body }}
          draft: false
          prerelease: false
